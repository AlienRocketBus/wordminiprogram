<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#070a10}
#stage{position:relative;width:420px;height:760px;margin:0 auto;background:linear-gradient(#101826,#0a0f18);overflow:hidden}
#bossSprite{position:absolute;left:50%;top:66px;width:184px;height:184px;transform:translateX(-50%);
  background:radial-gradient(circle at 50% 40%,#2a3550,#161d2e);border:2px solid #38507a;border-radius:16px;
  display:flex;align-items:center;justify-content:center;color:#8fb0e0;font:bold 15px sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.hero-section{position:absolute;left:0;right:0;top:430px;bottom:0}
.hero-hp-bar{position:absolute;left:40px;top:44px;width:340px;height:13px;background:#2a2f3a;border-radius:7px;overflow:hidden}
#heroHPFill{width:100%;height:100%;background:linear-gradient(#4ade80,#22c55e)}
#heroHPText{position:absolute;left:40px;top:20px;color:#cfe;font:12px sans-serif}
.answer{position:absolute;left:20px;right:20px;top:96px;bottom:22px;background:#131b28;border:1px solid #223047;border-radius:14px;
  display:flex;align-items:center;justify-content:center;color:#3a4a63;font:13px sans-serif}
</style></head>
<body>
<div id="stage">
  <div id="bossSprite">破阵者</div>
  <div class="hero-section">
    <div id="heroHPText">HP 100 / 100</div>
    <div class="hero-hp-bar"><div id="heroHPFill"></div></div>
    <div class="answer">答题区(特效严禁侵入)</div>
  </div>
</div>
<script src="hansen_boss_attack.js"></script>
<script>
try{localStorage.setItem('hansen_bossfx_on','1');}catch(e){}
window.HansenHeroHit=function(dmg,newHP,maxHP){
  var f=document.getElementById('heroHPFill'), tx=document.getElementById('heroHPText');
  var pct=Math.max(0,newHP/maxHP*100); if(f)f.style.width=pct+'%';
  if(tx)tx.textContent='HP '+newHP+' / '+maxHP;
};
window.__playVG=function(){ window.HansenBossAttack({name:'暗影先锋·破阵者'},20,80,100); };
</script>
</body></html>
