<script>
const G=window.MAP_GROUPS;

const TERR={
 lake:{f:'#8fb8cd',e:'#3f7a95',t:'#0d3a4d'}, plains:{f:'#b8cc7a',e:'#6f9a3a',t:'#3a5010'},
 clock:{f:'#d0ac78',e:'#9a7a48',t:'#4a3410'}, forge:{f:'#dd8a56',e:'#a85a2a',t:'#5a2408'},
 crystal:{f:'#bb9ad8',e:'#8060b0',t:'#3a2060'}, forest:{f:'#7fae66',e:'#4f8040',t:'#1a3a10'},

};
const NS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e}

// 拼图边: 从(x0,y0)到(x1,y1), tab: 0平 +1凸出 -1凹入
function edge(x0,y0,x1,y1,tab){
  const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy);
  const ux=dx/len,uy=dy/len;
  if(tab===0)return `L ${x1.toFixed(1)} ${y1.toFixed(1)} `;
  const r=len*0.15, m=len/2;
  const p1x=x0+ux*(m-r),p1y=y0+uy*(m-r);
  const p2x=x0+ux*(m+r),p2y=y0+uy*(m+r);
  const sweep=tab>0?1:0;
  return `L ${p1x.toFixed(1)} ${p1y.toFixed(1)} A ${r.toFixed(1)} ${r.toFixed(1)} 0 1 ${sweep} ${p2x.toFixed(1)} ${p2y.toFixed(1)} L ${x1.toFixed(1)} ${y1.toFixed(1)} `;
}
// 一块拼图path: 单元格(cx,cy)边长C, 四边tab
function piecePath(cx,cy,C,tabs){ // tabs={top,right,bottom,left}
  const TL=[cx,cy],TR=[cx+C,cy],BR=[cx+C,cy+C],BL=[cx,cy+C];
  let d=`M ${TL[0]} ${TL[1]} `;
  d+=edge(TL[0],TL[1],TR[0],TR[1],tabs.top);
  d+=edge(TR[0],TR[1],BR[0],BR[1],tabs.right);
  d+=edge(BR[0],BR[1],BL[0],BL[1],tabs.bottom);
  d+=edge(BL[0],BL[1],TL[0],TL[1],tabs.left);
  return d+'Z';
}
// 3x3网格布局
const C=98, OX=(380-3*C)/2, OY=88;
function cellXY(col,row){return [OX+col*C, OY+row*C]}
// (col,row) -> 岛id 或 'E'
const LAYOUT={'0,0':1,'1,0':2,'2,0':3,'0,1':8,'1,1':'E','2,1':4,'0,2':7,'1,2':6,'2,2':5};
// 每块tab: 右/下凸(+1), 左/上凹(-1), 边界平(0) —— 保证互补咬合
function tabsFor(col,row){
  return {
    top: row>0?-1:0,
    left: col>0?-1:0,
    right: col<2?1:0,
    bottom: row<2?1:0,
  };
}
const svg=document.getElementById('map');
// 标题
const tb=el('g',{});
tb.appendChild(el('rect',{x:100,y:20,width:180,height:32,rx:7,fill:'#d8c298',stroke:'#6f5a3c','stroke-width':1.4}));
let x=el('text',{x:190,y:36,'text-anchor':'middle','font-size':15,'font-weight':800,fill:'#4a3c28'});x.textContent='单词大陆 · 拼图地图';tb.appendChild(x);
x=el('text',{x:190,y:49,'text-anchor':'middle','font-size':10.5,fill:'#6f5a3c'});x.textContent='8 岛独立挑战 · 全通解锁女帝';tb.appendChild(x);
svg.appendChild(tb);

const NUM='①②③④⑤⑥⑦⑧';
// 先画8岛
for(const key in LAYOUT){
  const [col,row]=key.split(',').map(Number);
  const id=LAYOUT[key];
  if(id==='E')continue;
  const g=G.find(x=>x.id===id);
  const [cx,cy]=cellXY(col,row);
  const t=TERR[g.terrain];
  const isDone=!!done[id];
  const tabs=tabsFor(col,row);
  const grp=el('g',{class:'piece','data-id':id});
  const path=el('path',{d:piecePath(cx,cy,C,tabs),fill:t.f,stroke:isDone?'#3f9a3a':t.e,
    'stroke-width':isDone?3.5:1.6,'stroke-linejoin':'round'});
  grp.appendChild(path);
  // 地貌底纹(块底部一条深色地平)
  grp.appendChild(el('path',{d:`M ${cx+12} ${cy+C-16} q ${(C-24)/2} 10 ${C-24} 0`,fill:'none',stroke:t.e,'stroke-width':2,opacity:.4}));
  const mx=cx+C/2, my=cy+C/2;
  let e=el('text',{x:mx,y:my-10,'text-anchor':'middle','font-size':15,'font-weight':800,fill:t.t,class:'plabel'});e.textContent=NUM[id-1];grp.appendChild(e);
  e=el('text',{x:mx,y:my+8,'text-anchor':'middle','font-size':12.5,'font-weight':800,fill:t.t,class:'plabel'});e.textContent=g.name;grp.appendChild(e);
  e=el('text',{x:mx,y:my+24,'text-anchor':'middle','font-size':10,fill:t.t,class:'psub',opacity:.85});e.textContent='30词·'+g.boss+'boss';grp.appendChild(e);
  if(isDone){
    const fx=cx+C-20,fy=cy+20;
    grp.appendChild(el('line',{x1:fx,y1:fy,x2:fx,y2:fy-15,stroke:'#3f7a1a','stroke-width':2}));
    grp.appendChild(el('path',{d:`M ${fx} ${fy-15} l 11 4 l -11 4 z`,fill:'#3f9a3a',stroke:'#fff','stroke-width':1}));
  }
  grp.addEventListener('click',()=>openIsland(id));
  svg.appendChild(grp);
}
// 中心女帝块(最后画,在上)
const [ecx,ecy]=cellXY(1,1);
const allDone=G.every(g=>done[g.id]);
const eg=el('g',{class:'piece',id:'empress'});
const epath=el('path',{d:piecePath(ecx,ecy,C,tabsFor(1,1)),
  fill:allDone?'#d4537e':'#c3b2ba',stroke:allDone?'#993556':'#8a7a82','stroke-width':allDone?3.5:2});
eg.appendChild(epath);
const emx=ecx+C/2, emy=ecy+C/2;
if(allDone){
  let e=el('text',{x:emx,y:emy-10,'text-anchor':'middle','font-size':13,'font-weight':800,fill:'#fff'});e.textContent='★女帝★';eg.appendChild(e);
  e=el('text',{x:emx,y:emy+7,'text-anchor':'middle','font-size':10.5,fill:'#ffe0ec'});e.textContent='赛尔娅';eg.appendChild(e);
  e=el('text',{x:emx,y:emy+23,'text-anchor':'middle','font-size':10.5,'font-weight':800,fill:'#fff'});e.textContent='▶挑战';eg.appendChild(e);
}else{
  eg.appendChild(el('rect',{x:emx-14,y:emy-2,width:28,height:22,rx:3,fill:'#6a5a62'}));
  eg.appendChild(el('path',{d:`M ${emx-9} ${emy-2} v-7 a9 9 0 0 1 18 0 v7`,fill:'none',stroke:'#6a5a62','stroke-width':3.5}));
  let e=el('text',{x:emx,y:emy+36,'text-anchor':'middle','font-size':11,'font-weight':800,fill:'#5a4a52'});e.textContent='星海女帝';eg.appendChild(e);
  e=el('text',{x:emx,y:emy+49,'text-anchor':'middle','font-size':9.5,fill:'#7a6a72'});e.textContent='全通解锁';eg.appendChild(e);
}
eg.addEventListener('click',openEmpress);
svg.appendChild(eg);

function updP(){const n=G.filter(g=>done[g.id]).length;document.getElementById('ptext').textContent='进度 '+n+' / 8'+(n===8?' · 女帝解锁!':'')}
updP();

const overlay=document.getElementById('overlay');
function openIsland(id){
  const g=G.find(x=>x.id===id);
  document.getElementById('ptitle').textContent=NUM[id-1]+' '+g.name;
  document.getElementById('psubtitle').textContent=g.theme+' · '+g.words.length+' 词';
  document.getElementById('pboss').textContent='⚔ 这座岛聚集了 '+g.boss+' 个 Boss';
  const wc=document.getElementById('pwords');wc.innerHTML='';
  g.words.forEach(w=>{const r=document.createElement('div');r.className='wrow';
    r.innerHTML='<span class="wen">'+w.en+'</span><span class="wpn">'+(w.pn||'')+'</span><span class="wcn">'+w.cn+'</span>';wc.appendChild(r)});
  wc.scrollTop=0;
  const foot=document.getElementById('pfoot');foot.innerHTML='';const isDone=!!done[id];
  const enter=document.createElement('button');enter.className='pbtn enter';enter.textContent='进入学习 · 打 Boss';
  enter.onclick=()=>toggleDone(id);foot.appendChild(enter);
  const mark=document.createElement('button');mark.className='pbtn';mark.textContent=isDone?'✓已通关':'标记通关';
  mark.style.cssText='flex:0 0 auto;padding:11px 14px;'+(isDone?'background:#8fc470;color:#fff;box-shadow:0 3px 0 #4f8030':'background:#d8c8a8;color:#6a5838;box-shadow:0 3px 0 #b8a888');
  mark.onclick=()=>toggleDone(id);foot.appendChild(mark);
  overlay.classList.add('show');
}
function openEmpress(){
  const n=G.filter(g=>done[g.id]).length;
  if(n<8){
    document.getElementById('ptitle').textContent='★ 星海女帝 · 赛尔娅';

    const wc=document.getElementById('pwords');wc.innerHTML='';
    G.forEach(g=>{const r=document.createElement('div');r.className='wrow';
      r.innerHTML='<span class="wen" style="min-width:auto">'+NUM[g.id-1]+' '+g.name+'</span><span class="wcn">'+(done[g.id]?'✓ 已通关':'○ 未通关')+'</span>';wc.appendChild(r)});
    document.getElementById('pfoot').innerHTML='<button class="pbtn" style="background:#d8c8a8;color:#6a5838" onclick="closeP()">返回地图</button>';
  }else{
    document.getElementById('ptitle').textContent='★ 星海女帝 · 赛尔娅';
    document.getElementById('psubtitle').textContent='最终决战 · 已解锁';
    document.getElementById('pboss').textContent='👑 8 座岛屿全部通关 · 终战开启!';
    document.getElementById('pwords').innerHTML='<div style="padding:24px;text-align:center;color:#6a5838;font-size:14px;line-height:1.9">你已征服全部 240 个单词。<br>星海女帝在星域深处等你。<br><br>⚔️ 准备好终战了吗？</div>';
    document.getElementById('pfoot').innerHTML='<button class="pbtn enter" onclick="closeP()">▶ 挑战星海女帝</button>';
  }
  overlay.classList.add('show');
}
function toggleDone(id){done[id]=!done[id];if(!done[id])delete done[id];
  localStorage.setItem(DONE_KEY,JSON.stringify(done));overlay.classList.remove('show');setTimeout(()=>location.reload(),140)}
function closeP(){overlay.classList.remove('show')}
document.getElementById('pclose').onclick=closeP;
overlay.addEventListener('click',e=>{if(e.target===overlay)closeP()});
</script>
