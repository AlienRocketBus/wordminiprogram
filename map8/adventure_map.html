<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词大陆 · 冒险地图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#241c14}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
svg{position:absolute;top:0;left:0;width:100%;height:100%}
.spot{cursor:pointer;transition:transform .15s cubic-bezier(.34,1.5,.5,1);transform-origin:center;transform-box:fill-box}
.spot:active{transform:scale(.9) translateY(2px)}
.lbl{pointer-events:none}
#overlay{position:absolute;inset:0;background:rgba(30,22,14,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#overlay.show{display:flex}
#panel{width:100%;max-width:340px;max-height:86%;background:#f3ecd8;border-radius:16px;border:3px solid #6f5a3c;box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;transform:scale(.9);opacity:0;transition:.2s}
#overlay.show #panel{transform:scale(1);opacity:1}
#phead{padding:14px 16px 10px;border-bottom:2px solid #d8c8a8;position:relative;flex-shrink:0}
#phead h2{font-size:18px;color:#4a3c28;font-weight:800}
#phead .th{font-size:12px;color:#8a6f48;margin-top:3px}
#pclose{position:absolute;top:10px;right:12px;width:30px;height:30px;border:none;background:#e0d0b0;border-radius:50%;font-size:18px;color:#6f5a3c;cursor:pointer;line-height:1}
#pboss{padding:8px 16px;background:#efe4c8;font-size:12px;color:#8a5030;font-weight:700;flex-shrink:0;border-bottom:1px solid #d8c8a8}
#pwords{overflow-y:auto;padding:6px 12px;flex:1;-webkit-overflow-scrolling:touch}
.wrow{display:flex;align-items:baseline;padding:7px 8px;border-bottom:1px solid #e6dcc2;gap:8px}
.wrow:last-child{border-bottom:none}
.wen{font-size:15px;font-weight:700;color:#3a3020;min-width:96px}
.wpn{font-size:11px;color:#a08858;flex:1}
.wcn{font-size:13px;color:#6a5838;text-align:right}
#pfoot{padding:12px 16px;flex-shrink:0;border-top:2px solid #d8c8a8;display:flex;gap:10px}
.pbtn{flex:1;padding:11px;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
.pbtn.enter{background:linear-gradient(#e0a850,#c88830);color:#fff;box-shadow:0 3px 0 #a86818}
.pbtn:active{transform:translateY(2px);box-shadow:none}
#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:#5a4630;pointer-events:none;z-index:5;font-weight:700;text-shadow:0 1px 2px rgba(240,228,200,.6)}
#progress{position:absolute;top:10px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
#progress .pt{display:inline-block;background:#d8c298;border:1.4px solid #6f5a3c;border-radius:20px;padding:5px 16px;font-size:13px;color:#4a3c28;font-weight:800}
</style>
</head>
<body>
<div id="stage">
  <svg id="map" viewBox="0 0 380 620" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="progress"><span class="pt" id="ptext">进度 0 / 8</span></div>
  <div id="hint">点击地图上的地点 · 顺序随意 · 全通解锁女帝</div>
</div>
<div id="overlay"><div id="panel">
  <div id="phead"><h2 id="ptitle"></h2><div class="th" id="psubtitle"></div><button id="pclose">×</button></div>
  <div id="pboss"></div><div id="pwords"></div><div id="pfoot"></div>
</div></div>
<script>__DATA__</script>
<script>
const G=window.MAP_GROUPS;
const DONE_KEY='wc_map_done_v3';
let done={}; try{done=JSON.parse(localStorage.getItem(DONE_KEY)||'{}')}catch(e){done={}}
const NS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e}
function ap(p,d){const e=el('path',d);p.appendChild(e);return e}
function ac(p,d){const e=el('circle',d);p.appendChild(e);return e}
function ar(p,d){const e=el('rect',d);p.appendChild(e);return e}
function at(p,x,y,s,col,txt,w){const e=el('text',{x,y,'text-anchor':'middle','font-size':s,fill:col,class:'lbl'});if(w)e.setAttribute('font-weight',w);e.textContent=txt;p.appendChild(e);return e}

const svg=document.getElementById('map');

/* ---------- 地图背景 ---------- */
const bg=el('g',{});
ar(bg,{x:0,y:0,width:380,height:620,fill:'#e7d7b6'});
// 海岸/水域(边缘蓝)
ap(bg,{d:'M0 0 H380 V54 Q300 70 250 56 Q180 40 120 60 Q60 78 0 62 Z',fill:'#a9c6d4',opacity:.55});
ap(bg,{d:'M0 620 H380 V566 Q300 556 250 570 Q170 586 100 566 Q50 552 0 570 Z',fill:'#a9c6d4',opacity:.55});
ap(bg,{d:'M0 180 Q26 240 12 320 Q0 400 16 470 L0 470 Z',fill:'#a9c6d4',opacity:.45});
ap(bg,{d:'M380 150 Q356 220 370 300 Q382 380 366 450 L380 450 Z',fill:'#a9c6d4',opacity:.45});
// 陆地主体(不规则)
ap(bg,{d:'M40 70 Q120 52 200 66 Q290 52 344 78 Q366 160 356 260 Q368 360 342 452 Q300 540 210 556 Q120 544 74 512 Q30 452 22 360 Q14 250 30 160 Q34 110 40 70 Z',
  fill:'#ecdcbc',stroke:'#c2a878','stroke-width':2});
// 山脉纹路(装饰)
for(const m of [[70,120],[92,132],[300,120],[322,134],[60,470],[84,486]]){
  ap(bg,{d:`M${m[0]} ${m[1]} l8 -14 l8 14 z`,fill:'none',stroke:'#b09868','stroke-width':1.4,opacity:.6});
}
// 小树点缀
for(const t of [[130,150],[250,470],[300,430],[80,300]]){
  ap(bg,{d:`M${t[0]} ${t[1]} l5 -12 l5 12 z`,fill:'#9aad78',opacity:.5});
}
// 蜿蜒虚线小路(连接各点的feel)
ap(bg,{d:'M100 470 Q80 400 130 350 Q200 320 190 260 Q170 200 230 170 Q290 150 300 120',fill:'none',stroke:'#b89a68','stroke-width':2,'stroke-dasharray':'2 8',opacity:.55});
ap(bg,{d:'M300 300 Q250 320 220 380 Q200 430 250 470',fill:'none',stroke:'#b89a68','stroke-width':2,'stroke-dasharray':'2 8',opacity:.5});
// 边框
ar(bg,{x:5,y:5,width:370,height:610,rx:6,fill:'none',stroke:'#b79a68','stroke-width':6});
ar(bg,{x:12,y:12,width:356,height:596,rx:3,fill:'none',stroke:'#6f5a3c','stroke-width':1.4});
svg.appendChild(bg);
// 罗盘
const comp=el('g',{transform:'translate(340,580)'});
ac(comp,{r:18,fill:'#e3d1a8',stroke:'#6f5a3c','stroke-width':1.4});
ap(comp,{d:'M0 -15 L3 0 L0 15 L-3 0 Z',fill:'#a05a30'});
ap(comp,{d:'M-15 0 L0 -3 L15 0 L0 3 Z',fill:'#8a6f48'});
at(comp,0,-9,8,'#6f5a3c','N',700);
svg.appendChild(comp);
// 标题
const tb=el('g',{});
ar(tb,{x:104,y:20,width:172,height:30,rx:7,fill:'#d8c298',stroke:'#6f5a3c','stroke-width':1.4});
at(tb,190,40,14,'#4a3c28','单词大陆 · 冒险地图',800);
svg.appendChild(tb);

/* ---------- 地点图标绘制器 ---------- */
// 每个图标: 先画底座凹槽(嵌入感), 再画地貌造型, 都在(cx,cy)附近, 大小~scale
function drawBase(g,cx,cy,r,done){
  // 椭圆凹槽底座(深色阴影+浅色边=嵌入感)
  ap(g,{d:`M ${cx-r} ${cy+r*0.5} a ${r} ${r*0.4} 0 1 0 ${2*r} 0 a ${r} ${r*0.4} 0 1 0 ${-2*r} 0`,
    fill:'#c9b088',stroke:'#a88c5c','stroke-width':2});
  ac(g,{cx,cy:cy+r*0.5,r:r*0.86,fill:'rgba(120,96,60,.18)'}); // 内阴影暗示凹陷
  if(done){ // 通关金环
    ap(g,{d:`M ${cx-r-3} ${cy+r*0.5} a ${r+3} ${(r+3)*0.4} 0 1 0 ${2*(r+3)} 0 a ${r+3} ${(r+3)*0.4} 0 1 0 ${-2*(r+3)} 0`,
      fill:'none',stroke:'#e0b040','stroke-width':3});
  }
}
const ICON={
  // ① 湖: 蓝水塘+波纹
  lake(g,cx,cy){ac(g,{cx,cy:cy-4,r:20,fill:'#8fb8cd',stroke:'#3f7a95','stroke-width':2});
    ap(g,{d:`M${cx-13} ${cy-8} q7 3 14 0`,fill:'none',stroke:'#eaf4f8','stroke-width':1.6});
    ap(g,{d:`M${cx-11} ${cy} q6 3 12 0 t12 0`,fill:'none',stroke:'#5f9db5','stroke-width':1.6});
    ap(g,{d:`M${cx-9} ${cy+7} q5 2 10 0`,fill:'none',stroke:'#5f9db5','stroke-width':1.4});},
  // ② 草原: 绿丘+草
  plains(g,cx,cy){ap(g,{d:`M${cx-22} ${cy+8} q22 -22 44 0 z`,fill:'#a8c05a',stroke:'#6f9a3a','stroke-width':2});
    for(let i=-14;i<=14;i+=7)ap(g,{d:`M${cx+i} ${cy+4} l0 -9 M${cx+i-3} ${cy+4} l3 -7 M${cx+i+3} ${cy+4} l-3 -7`,fill:'none',stroke:'#4f7a2a','stroke-width':1.3});},
  // ③ 钟谷: 钟表
  clock(g,cx,cy){ac(g,{cx,cy:cy-2,r:19,fill:'#efe4c8',stroke:'#9a7a48','stroke-width':2.5});
    for(let a=0;a<360;a+=30){const rad=a*Math.PI/180;ap(g,{d:`M${cx+15*Math.cos(rad)} ${cy-2+15*Math.sin(rad)} L${cx+17*Math.cos(rad)} ${cy-2+17*Math.sin(rad)}`,stroke:'#9a7a48','stroke-width':1.2})}
    ap(g,{d:`M${cx} ${cy-2} L${cx} ${cy-13}`,stroke:'#5a3c1a','stroke-width':2.2});
    ap(g,{d:`M${cx} ${cy-2} L${cx+9} ${cy+2}`,stroke:'#5a3c1a','stroke-width':1.8});ac(g,{cx,cy:cy-2,r:2,fill:'#5a3c1a'});},
  // ④ 锻炉山: 山+火
  forge(g,cx,cy){ap(g,{d:`M${cx-22} ${cy+10} L${cx-4} ${cy-16} L${cx+22} ${cy+10} Z`,fill:'#8a7a68',stroke:'#5a4a38','stroke-width':2});
    ap(g,{d:`M${cx+2} ${cy+10} L${cx+13} ${cy-8} L${cx+22} ${cy+10} Z`,fill:'#77675a'});
    ap(g,{d:`M${cx-4} ${cy-16} q-4 8 0 14 q4 -6 3 -12`,fill:'#e07030'});
    ap(g,{d:`M${cx-6} ${cy+8} q6 -3 12 0`,fill:'#f0a850',opacity:.8});},
  // ⑤ 晶石: 水晶
  crystal(g,cx,cy){ap(g,{d:`M${cx} ${cy-18} L${cx+8} ${cy-2} L${cx} ${cy+12} L${cx-8} ${cy-2} Z`,fill:'#b89ad4',stroke:'#8060b0','stroke-width':2});
    ap(g,{d:`M${cx-15} ${cy+10} L${cx-11} ${cy-6} L${cx-6} ${cy+10} Z`,fill:'#a889c8',stroke:'#8060b0','stroke-width':1.6});
    ap(g,{d:`M${cx+6} ${cy+10} L${cx+11} ${cy-4} L${cx+15} ${cy+10} Z`,fill:'#c4aae0',stroke:'#8060b0','stroke-width':1.6});
    ap(g,{d:`M${cx} ${cy-18} L${cx} ${cy+12}`,stroke:'#e0d0f0','stroke-width':1,opacity:.7});},
  // ⑥ 书林: 树+书
  forest(g,cx,cy){ap(g,{d:`M${cx-16} ${cy+8} L${cx-9} ${cy-14} L${cx-2} ${cy+8} Z`,fill:'#6f9058',stroke:'#4f8040','stroke-width':1.6});
    ap(g,{d:`M${cx+1} ${cy+8} L${cx+9} ${cy-16} L${cx+17} ${cy+8} Z`,fill:'#567a45',stroke:'#4f8040','stroke-width':1.6});
    ar(g,{x:cx-9,y:cy+8,width:4,height:6,fill:'#7a5a3a'});ar(g,{x:cx+7,y:cy+8,width:4,height:6,fill:'#7a5a3a'});
    ap(g,{d:`M${cx-8} ${cy+2} q8 -4 16 0 v8 h-16 z`,fill:'#e8dcc0',stroke:'#b8a078','stroke-width':1.2});
    ap(g,{d:`M${cx} ${cy+1} v9`,stroke:'#b8a078','stroke-width':1});},
  // ⑦ 港城: 房子+水
  port(g,cx,cy){ar(g,{x:cx-16,y:cy-6,width:9,height:16,fill:'#c9a878',stroke:'#8a6f48','stroke-width':1.4});
    ar(g,{x:cx-4,y:cy-12,width:10,height:22,fill:'#bfa06a',stroke:'#8a6f48','stroke-width':1.4});
    ar(g,{x:cx+8,y:cy-3,width:8,height:13,fill:'#c9a878',stroke:'#8a6f48','stroke-width':1.4});
    ap(g,{d:`M${cx-4} ${cy-12} l5 -5 l5 5 z`,fill:'#9a7a48'});
    ap(g,{d:`M${cx-18} ${cy+12} q9 3 18 0 t18 0`,fill:'none',stroke:'#5f9db5','stroke-width':1.8});},
  // ⑧ 火山口: 火山喷发
  volcano(g,cx,cy){ap(g,{d:`M${cx-22} ${cy+10} L${cx-8} ${cy-12} L${cx+8} ${cy-12} L${cx+22} ${cy+10} Z`,fill:'#a07868',stroke:'#6a4a38','stroke-width':2});
    ap(g,{d:`M${cx-8} ${cy-12} L${cx+8} ${cy-12} L${cx+4} ${cy-6} L${cx-4} ${cy-6} Z`,fill:'#e04828'});
    ap(g,{d:`M${cx-3} ${cy-12} q-3 -10 0 -16 M${cx+3} ${cy-12} q3 -8 1 -14`,fill:'none',stroke:'#e86838','stroke-width':2.2});
    ac(g,{cx:cx-5,cy:cy-22,r:3,fill:'#e86838',opacity:.7});ac(g,{cx:cx+5,cy:cy-25,r:2.5,fill:'#f0a850',opacity:.7});},
};

const NUM='①②③④⑤⑥⑦⑧';
const LBLC={lake:'#0d3a4d',plains:'#3a5010',clock:'#4a3410',forge:'#5a2408',crystal:'#3a2060',forest:'#1a3a10',port:'#4a3818',volcano:'#5a1808'};
// 8个地点在地图上的散布坐标(不规则)
const POS={
 1:[92,150], 2:[210,120], 3:[305,150],   // 上排
 8:[70,300], 4:[315,300],                 // 中两侧
 7:[100,470], 6:[205,500], 5:[305,455],   // 下排
};
// 画8个地点
for(const g of G){
  const [cx,cy]=POS[g.id];
  const isDone=!!done[g.id];
  const spot=el('g',{class:'spot','data-id':g.id});
  drawBase(spot,cx,cy,26,isDone);
  ICON[g.terrain](spot,cx,cy);
  // 名牌
  const bw=g.name.length*13+16;
  ar(spot,{x:cx-bw/2,y:cy+22,width:bw,height:18,rx:9,fill:'#f2e6c8',stroke:isDone?'#3f9a3a':'#a88c5c','stroke-width':isDone?2:1.2});
  at(spot,cx,cy+35,12,LBLC[g.terrain],NUM[g.id-1]+' '+g.name,800);
  at(spot,cx,cy+50,9.5,'#8a6f48','30词·'+g.boss+'boss',700);
  if(isDone){ // 通关旗
    ap(spot,{d:`M${cx+18} ${cy-20} v-15`,stroke:'#3f7a1a','stroke-width':2});
    ap(spot,{d:`M${cx+18} ${cy-35} l11 4 l-11 4 z`,fill:'#3f9a3a',stroke:'#fff','stroke-width':1});
  }
  spot.addEventListener('click',()=>openIsland(g.id));
  svg.appendChild(spot);
}
// 中心女帝城堡
const [ECX,ECY]=[190,300];
const allDone=G.every(g=>done[g.id]);
const eg=el('g',{class:'spot',id:'empress'});
drawBase(eg,ECX,ECY,32,allDone);
// 城堡造型
const cf=allDone?'#c98fb0':'#b0a0a8', cs=allDone?'#8a4a6a':'#7a6a72';
ar(eg,{x:ECX-20,y:ECY-8,width:40,height:22,fill:cf,stroke:cs,'stroke-width':2});
ar(eg,{x:ECX-24,y:ECY-20,width:11,height:26,fill:cf,stroke:cs,'stroke-width':1.8});
ar(eg,{x:ECX+13,y:ECY-20,width:11,height:26,fill:cf,stroke:cs,'stroke-width':1.8});
ar(eg,{x:ECX-6,y:ECY-26,width:12,height:32,fill:cf,stroke:cs,'stroke-width':1.8});
// 城垛
for(const bx of [-24,-19,13,18]){ar(eg,{x:ECX+bx,y:ECY-24,width:5,height:5,fill:cf,stroke:cs,'stroke-width':1})}
ap(eg,{d:`M${ECX-6} ${ECY-26} l6 -8 l6 8 z`,fill:allDone?'#a86890':'#9878a8'});
if(allDone){
  ap(eg,{d:`M${ECX} ${ECY-34} l0 -8 l7 3 l-7 2`,fill:'#e8c860',stroke:'#b8983a','stroke-width':.8}); // 金旗
  at(eg,ECX,ECY-40,11,'#d0a020','★',400);
}else{
  ar(eg,{x:ECX-8,y:ECY-2,width:16,height:13,rx:2,fill:'#6a5a62'}); // 锁
  ap(eg,{d:`M${ECX-5} ${ECY-2} v-4 a5 5 0 0 1 10 0 v4`,fill:'none',stroke:'#6a5a62','stroke-width':2.5});
}
// 女帝名牌
ar(eg,{x:ECX-42,y:ECY+26,width:84,height:20,rx:10,fill:'#e6d0e0',stroke:allDone?'#8a4a6a':'#8a7a82','stroke-width':1.6});
at(eg,ECX,ECY+40,12,allDone?'#7a2a5a':'#5a4a52','★ 星海女帝 ★',800);
at(eg,ECX,ECY+56,10,allDone?'#993556':'#7a6a72',allDone?'赛尔娅 · 点击挑战':'全通后解锁',700);
eg.addEventListener('click',openEmpress);
svg.appendChild(eg);

function updP(){const n=G.filter(g=>done[g.id]).length;document.getElementById('ptext').textContent='进度 '+n+' / 8'+(n===8?' · 女帝解锁!':'')}
updP();

const overlay=document.getElementById('overlay');
function openIsland(id){
  const g=G.find(x=>x.id===id);
  document.getElementById('ptitle').textContent=NUM[id-1]+' '+g.name;
  document.getElementById('psubtitle').textContent=g.theme+' · '+g.words.length+' 词';
  document.getElementById('pboss').textContent='⚔ 这座岛聚集了 '+g.boss+' 个 Boss';
  const wc=document.getElementById('pwords');wc.innerHTML='';
  g.words.forEach(w=>{const r=document.createElement('div');r.className='wrow';
    r.innerHTML='<span class="wen">'+w.en+'</span><span class="wpn">'+(w.pn||'')+'</span><span class="wcn">'+w.cn+'</span>';wc.appendChild(r)});
  wc.scrollTop=0;
  const foot=document.getElementById('pfoot');foot.innerHTML='';const isDone=!!done[id];
  const enter=document.createElement('button');enter.className='pbtn enter';enter.textContent='进入学习 · 打 Boss';
  enter.onclick=()=>toggleDone(id);foot.appendChild(enter);
  const mark=document.createElement('button');mark.textContent=isDone?'✓已通关':'标记通关';mark.className='pbtn';
  mark.style.cssText='flex:0 0 auto;padding:11px 14px;'+(isDone?'background:#8fc470;color:#fff;box-shadow:0 3px 0 #4f8030':'background:#d8c8a8;color:#6a5838;box-shadow:0 3px 0 #b8a888');
  mark.onclick=()=>toggleDone(id);foot.appendChild(mark);
  overlay.classList.add('show');
}
function openEmpress(){
  const n=G.filter(g=>done[g.id]).length;
  if(n<8){
    document.getElementById('ptitle').textContent='★ 星海女帝 · 赛尔娅';
    document.getElementById('psubtitle').textContent='最终 BOSS · 尚未解锁';
    document.getElementById('pboss').textContent='🔒 还需通关 '+(8-n)+' 座岛屿';
    const wc=document.getElementById('pwords');wc.innerHTML='';
    G.forEach(g=>{const r=document.createElement('div');r.className='wrow';
      r.innerHTML='<span class="wen" style="min-width:auto">'+NUM[g.id-1]+' '+g.name+'</span><span class="wcn">'+(done[g.id]?'✓ 已通关':'○ 未通关')+'</span>';wc.appendChild(r)});
    document.getElementById('pfoot').innerHTML='<button class="pbtn" style="background:#d8c8a8;color:#6a5838" onclick="closeP()">返回地图</button>';
  }else{
    document.getElementById('ptitle').textContent='★ 星海女帝 · 赛尔娅';
    document.getElementById('psubtitle').textContent='最终决战 · 已解锁';
    document.getElementById('pboss').textContent='👑 8 座岛屿全部通关 · 终战开启!';
    document.getElementById('pwords').innerHTML='<div style="padding:24px;text-align:center;color:#6a5838;font-size:14px;line-height:1.9">你已征服全部 240 个单词。<br>星海女帝在星域深处等你。<br><br>⚔️ 准备好终战了吗？</div>';
    document.getElementById('pfoot').innerHTML='<button class="pbtn enter" onclick="closeP()">▶ 挑战星海女帝</button>';
  }
  overlay.classList.add('show');
}
function toggleDone(id){done[id]=!done[id];if(!done[id])delete done[id];
  localStorage.setItem(DONE_KEY,JSON.stringify(done));overlay.classList.remove('show');setTimeout(()=>location.reload(),140)}
function closeP(){overlay.classList.remove('show')}
document.getElementById('pclose').onclick=closeP;
overlay.addEventListener('click',e=>{if(e.target===overlay)closeP()});
</script>
</body>
</html>
