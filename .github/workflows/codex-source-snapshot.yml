name: Codex private source snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bundle exact main history
        shell: bash
        run: |
          git branch -f main-snapshot "${{ github.event.pull_request.base.sha || github.sha }}"
          git bundle create wordminiprogram-v939-main.bundle main-snapshot
          git bundle verify wordminiprogram-v939-main.bundle

      - name: Upload private Git bundle
        uses: actions/upload-artifact@v4
        with:
          name: wordminiprogram-v939-main-git-bundle
          path: wordminiprogram-v939-main.bundle
          if-no-files-found: error
          retention-days: 1
