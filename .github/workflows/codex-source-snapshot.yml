name: Codex private source snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive exact main baseline
        shell: bash
        run: git archive --format=zip --output=wordminiprogram-v939-main.zip "${{ github.event.pull_request.base.sha || github.sha }}"

      - name: Upload private snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wordminiprogram-v939-main
          path: wordminiprogram-v939-main.zip
          if-no-files-found: error
          retention-days: 1
