# 反复测试：同一批测试在 10 台机器上同时各跑一遍，专抓「偶尔才出一次」的问题。
#
# 为什么要有它（虫洞主义）：联机对战的毛病常常十次里才出一次。以前在沙盒里反复跑太贵（又慢又费 token），
#   现在交给 GitHub：10 轮同时跑，**哪一轮失败都算**（不重跑、不放过），结论表列出每个测试失败了几轮。
# 怎么用：Actions 页 → 反复测试 → Run workflow，填要跑的测试名片段（默认 _cloud_v = 全部真 SDK 联机测试（v1164、v1165……都算））。
#   AI 也可以用 GitHub 接口直接触发。
name: 反复测试

on:
  # 开发分支上：提交说明以 [反复测试] 开头就跑（默认 _cloud_v 跑 10 轮）；手动点也行（手动要等它进了 main）
  push:
    branches: ['claude/**']
  workflow_dispatch:
    inputs:
      only:
        description: '测试名里包含的片段（比如 _cloud_v、cloud_v1165、room、ladder）'
        default: '_cloud_v'
        required: true
      rounds:
        description: '跑几轮（1–10，每轮一台机器）'
        default: '10'
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: 排几轮
    # 提交说明必须以 [反复测试] 开头才跑 —— 只在正文里提到这个词不算（11-04 踩到：说明文字里写了它，就白跑了 10 台机器）
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[反复测试]')
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - id: p
        env: { ROUNDS: "${{ inputs.rounds || '10' }}" }
        run: python3 -c "import os;n=max(1,min(10,int(os.environ['ROUNDS'])));print('list='+str(list(range(1,n+1))))" >> "$GITHUB_OUTPUT"

  round:
    name: 第 ${{ matrix.round }} 轮
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        round: ${{ fromJSON(needs.plan.outputs.list) }}
    env:
      SIPHON_PARALLEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: requirements-audit.txt }
      - name: 装依赖
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements-audit.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 装浏览器
        run: npx playwright install --with-deps chromium > /tmp/pw.log 2>&1 || { tail -30 /tmp/pw.log; exit 1; }
      - name: 跑一轮（失败不重跑）
        env: { ONLY: "${{ inputs.only || '_cloud_v' }}" }
        # 失败不在这里判红（只由「结论」判）—— 每次运行只发一条结果通知
        run: python3 一键体检.py --only "$ONLY" --no-retry --tag "r${{ matrix.round }}" || echo "这一轮有失败，由「结论」判定"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'repeat-${{ matrix.round }}', path: .siphon/, retention-days: 14, if-no-files-found: ignore, include-hidden-files: true }

  summary:
    name: 结论
    needs: [plan, round]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/scripts }
      - uses: actions/download-artifact@v4
        with: { pattern: 'repeat-*', path: logs }
      - name: 每个测试失败了几轮
        env:
          ROUNDS: ${{ inputs.rounds || '10' }}
          ONLY: ${{ inputs.only || '_cloud_v' }}
        run: python3 .github/scripts/siphon_summary.py repeat
