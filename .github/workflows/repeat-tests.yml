# 反复测试：同一批测试在 10 台机器上同时各跑一遍，专抓「偶尔才出一次」的问题。
#
# 为什么要有它（虫洞主义）：联机对战的毛病常常十次里才出一次。以前在沙盒里反复跑太贵（又慢又费 token），
#   现在交给 GitHub：10 轮同时跑，**哪一轮失败都算**（不重跑、不放过），结论表列出每个测试失败了几轮。
# 怎么用：Actions 页 → 反复测试 → Run workflow，填要跑的测试名片段（默认 cloud_v1164 = 全部真 SDK 联机测试）。
#   AI 也可以用 GitHub 接口直接触发。
name: 反复测试

on:
  # 开发分支上：提交说明写 [反复测试] 就跑（默认 cloud_v1164 跑 10 轮）；手动点也行（手动要等它进了 main）
  push:
    branches: ['claude/**']
  workflow_dispatch:
    inputs:
      only:
        description: '测试名里包含的片段（比如 cloud_v1164、room、ladder）'
        default: 'cloud_v1164'
        required: true
      rounds:
        description: '跑几轮（1–10，每轮一台机器）'
        default: '10'
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: 排几轮
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[反复测试]')
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - id: p
        env: { ROUNDS: "${{ inputs.rounds || '10' }}" }
        run: python3 -c "import os;n=max(1,min(10,int(os.environ['ROUNDS'])));print('list='+str(list(range(1,n+1))))" >> "$GITHUB_OUTPUT"

  round:
    name: 第 ${{ matrix.round }} 轮
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        round: ${{ fromJSON(needs.plan.outputs.list) }}
    env:
      SIPHON_PARALLEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: requirements-audit.txt }
      - name: 装依赖
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements-audit.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 装浏览器
        run: npx playwright install --with-deps chromium > /tmp/pw.log 2>&1 || { tail -30 /tmp/pw.log; exit 1; }
      - name: 跑一轮（失败不重跑）
        env: { ONLY: "${{ inputs.only || 'cloud_v1164' }}" }
        run: python3 一键体检.py --only "$ONLY" --no-retry --tag "r${{ matrix.round }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'repeat-${{ matrix.round }}', path: .siphon/, retention-days: 14, if-no-files-found: ignore, include-hidden-files: true }

  summary:
    name: 结论
    needs: [plan, round]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'repeat-*', path: logs }
      - name: 每个测试失败了几轮
        env:
          ROUNDS: ${{ inputs.rounds || '10' }}
          ONLY: ${{ inputs.only || 'cloud_v1164' }}
        run: |
          python3 - <<'PY'
          import glob, json, os, collections
          fail = collections.defaultdict(list); seen = collections.Counter(); rounds = 0
          for f in sorted(glob.glob('logs/*/only_*.json')):
              rounds += 1
              for t, r in json.load(open(f, encoding='utf-8')).items():
                  seen[t] += 1
                  if r:
                      fail[t].append(str(r).replace('|', '/')[:120])
          want = max(1, min(10, int(os.environ['ROUNDS'])))
          ok = rounds == want and not fail and seen
          out = ['## ' + ('✅ %d 轮全部通过' % rounds if ok else '❌ 有问题'), '',
                 '测试片段 `%s` · 交回结果的 %d/%d 轮 · %d 个测试' % (os.environ['ONLY'], rounds, want, len(seen)), '']
          if fail:
              out += ['| 测试 | 失败几轮 | 第一次失败的原因 |', '|---|---|---|']
              out += ['| `%s` | %d / %d | %s |' % (t, len(v), seen[t], v[0]) for t, v in sorted(fail.items(), key=lambda x: -len(x[1]))]
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('\n'.join(out) + '\n')
          print('\n'.join(out))
          raise SystemExit(0 if ok else 1)
          PY
