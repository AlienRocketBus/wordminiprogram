name: Auto Release on Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: v$VERSION"

      - name: Build deploy package and create release (skip if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v${V}"
          # 🔴v1158：**"已存在就跳过"会让包永远停在第一次打的那一版。**
          #
          #   用户发现的：v1157 的标签用 push -f 挪到了最新提交，
          #   但 Release 上挂的 zip 还是几小时前打的那个 ——
          #   中间所有改动一个都不在包里。
          #
          #   他下载到的是"标着最新版本号的旧包"，**比明确报错更糟**：
          #   他会以为自己在测新功能，测不出效果还以为是功能没做好。
          #
          #   > 一个包该不该重打，看的是"代码有没有往前走"，
          #   > 不是"这个名字用过没有"。
          #
          #   改法：Release 已存在时，比对 body 里记的 commit 是不是当前的。
          #   不是就删掉重建；是就跳过（避免每次 push 都白打一次包）。
          # ⚠️ 用 GITHUB_SHA 而不是 git rev-parse ——
          #    CI 里 checkout 可能是浅克隆，rev-parse 未必可靠，
          #    而 GITHUB_SHA 是 Actions 保证给的当前提交。
          #    （第一版写 git rev-parse，CI 直接失败。）
          SHA_NOW="${GITHUB_SHA}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            BODY="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || echo '')"
            if echo "$BODY" | grep -q "$SHA_NOW"; then
              echo "Release $TAG already built from $SHA_NOW, skipping."
              exit 0
            fi
            echo "Release $TAG exists but was built from an older commit - rebuilding."
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          fi
          # 用唯一正式打包器构建（未登记版本会失败关闭，防误发 v961/v962 等）
          # 🔴v1081: CI 上必须自己跑发版闸门。
          #   .jarvis_pass.json 是本地状态、已 gitignore（否则别人拉到就等于白拿背书），
          #   所以 CI 环境永远没有这枚凭证 → package_release 必然拒绝出包。
          #   这是 v1070 加发版硬条件时埋下的：本地打好包提交时看不出来，
          #   一旦 CI 自己打包就必然失败。闸门本身很快（分钟级），CI 上照跑。
          python3 jarvis_gate.py
          python3 package_release.py "$V" --out release-assets
          DEPLOY="release-assets/单词大冒险_v${V}_可直接部署.zip"
          test -f "$DEPLOY"
          # GitHub 会清洗附件文件名中的非ASCII字符：底层用ASCII文件名，界面用中文标签
          ASCII_DEPLOY="release-assets/wordminiprogram_v${V}_deploy.zip"
          cp "$DEPLOY" "$ASCII_DEPLOY"
          # 按用户要求：Release 只附可直接部署包
          gh release create "$TAG" "${ASCII_DEPLOY}#单词大冒险_v${V}_可直接部署.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --notes "自动发布 v${V}（commit ${GITHUB_SHA}）。附件为可直接部署包：解压后把全部文件原样上传到静态网站根目录即可（不要再套一层目录）。" \
            --target "$GITHUB_SHA"
          echo "Release $TAG created with deploy package."

          # 🔴v1051 只保留最新 5 个 Release，其余连同 tag 一并删除。
          # 每个发布包约 80MB，不清理会持续累积占用仓库空间。
          # 🔴v1056 第四次修，这次改为调用独立脚本 .github/scripts/prune_releases.py。
          # 前三次（v1051/v1053/v1055）都失败于"环境假设"而非逻辑：
          #   依赖 gh 列输出格式 → 依赖 gh --jq 内建组件 → 均静默返回空，
          #   表现为"CI success、日志无异常、但什么都没删"。
          # 独立脚本只用 Python 标准库，且**已在本地实测真实删除成功**，
          # 并带 gh CLI 与纯 API 双通道，任一可用即可完成。
          KEEP_RELEASES=5 python3 .github/scripts/prune_releases.py || true
