name: Auto Release on Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: v$VERSION"

      - name: Build deploy package and create release (skip if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v${V}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          # 用唯一正式打包器构建（未登记版本会失败关闭，防误发 v961/v962 等）
          python3 package_release.py "$V" --out release-assets
          DEPLOY="release-assets/单词大冒险_v${V}_可直接部署.zip"
          test -f "$DEPLOY"
          # GitHub 会清洗附件文件名中的非ASCII字符：底层用ASCII文件名，界面用中文标签
          ASCII_DEPLOY="release-assets/wordminiprogram_v${V}_deploy.zip"
          cp "$DEPLOY" "$ASCII_DEPLOY"
          # 按用户要求：Release 只附可直接部署包
          gh release create "$TAG" "${ASCII_DEPLOY}#单词大冒险_v${V}_可直接部署.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --notes "自动发布 v${V}（commit ${GITHUB_SHA}）。附件为可直接部署包：解压后把全部文件原样上传到静态网站根目录即可（不要再套一层目录）。" \
            --target "$GITHUB_SHA"
          echo "Release $TAG created with deploy package."

          # 🔴v1051 只保留最新 5 个 Release，其余连同 tag 一并删除。
          # 每个发布包约 80MB，不清理会持续累积占用仓库空间。
          KEEP=5
          echo "Pruning old releases, keeping newest $KEEP ..."
          # 🔴v1053 改用 API 取 tag，不依赖 `gh release list` 的列输出格式
          #（v1051/v1052 两次都没删成：新版 gh 的首列未必是 tag_name，
          #  awk '{print $1}' 取到的可能是标题，grep '^v[0-9]+$' 全部落空，
          #  于是循环体一次都没执行，而管道整体退出码为 0，日志看不出异常）。
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > /tmp/all_tags.txt || true
          echo "  found $(wc -l < /tmp/all_tags.txt) releases"
          grep -E '^v[0-9]+$' /tmp/all_tags.txt \
            | sed 's/^v//' | sort -rn | tail -n +$((KEEP + 1)) > /tmp/drop_tags.txt || true
          echo "  to delete: $(wc -l < /tmp/drop_tags.txt)"
          while read -r OLD; do
            [ -z "$OLD" ] && continue
            echo "  deleting v$OLD"
            gh release delete "v$OLD" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
              || gh release delete "v$OLD" --repo "$GITHUB_REPOSITORY" --yes \
              || true
          done < /tmp/drop_tags.txt
          echo "Prune done. Remaining:"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | head -10
