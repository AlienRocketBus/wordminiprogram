name: Auto Release on Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: v$VERSION"

      - name: Build deploy package and create release (skip if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v${V}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          # 用唯一正式打包器构建（未登记版本会失败关闭，防误发 v961/v962 等）
          python3 package_release.py "$V" --out release-assets
          DEPLOY="release-assets/单词大冒险_v${V}_可直接部署.zip"
          test -f "$DEPLOY"
          # GitHub 会清洗附件文件名中的非ASCII字符：底层用ASCII文件名，界面用中文标签
          ASCII_DEPLOY="release-assets/wordminiprogram_v${V}_deploy.zip"
          cp "$DEPLOY" "$ASCII_DEPLOY"
          # 按用户要求：Release 只附可直接部署包
          gh release create "$TAG" "${ASCII_DEPLOY}#单词大冒险_v${V}_可直接部署.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --notes "自动发布 v${V}（commit ${GITHUB_SHA}）。附件为可直接部署包：解压后把全部文件原样上传到静态网站根目录即可（不要再套一层目录）。" \
            --target "$GITHUB_SHA"
          echo "Release $TAG created with deploy package."

          # 🔴v1051 只保留最新 5 个 Release，其余连同 tag 一并删除。
          # 每个发布包约 80MB，不清理会持续累积占用仓库空间。
          KEEP=5
          echo "Pruning old releases, keeping newest $KEEP ..."
          # 按版本号数值倒序（而非发布时间），跳过前 KEEP 个，其余删除
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            | awk '{print $1}' \
            | grep -E '^v[0-9]+$' \
            | sed 's/^v//' \
            | sort -rn \
            | tail -n +$((KEEP + 1)) \
            | while read -r OLD; do
                echo "  deleting v$OLD"
                gh release delete "v$OLD" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || \
                  gh release delete "v$OLD" --repo "$GITHUB_REPOSITORY" --yes || true
              done
          echo "Prune done. Remaining:"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 20 | head -10
