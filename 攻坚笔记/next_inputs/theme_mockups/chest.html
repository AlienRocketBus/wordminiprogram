<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>开宝箱 · 主题2.0 样稿</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="common.css">
<style>
.app{padding-bottom:24px}
.head{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.back{display:inline-flex;align-items:center;justify-content:center;height:var(--tap);padding:0 14px;border-radius:var(--r-pill);background:var(--surface-2);border:1.5px solid var(--line-strong);color:var(--ink-1);font:900 15px/1 var(--font-display)}
.head h2{font:900 22px/1.1 var(--font-display)}
.streak{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 0}
.streak .days{display:flex;gap:6px}
.streak .days i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 13px/1 var(--font-latin);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-style:normal}
.streak .days i.ok{background:var(--good-surface);color:var(--on-good-surface);border-color:var(--good)}
.streak .days i.now{background:var(--accent-1);color:var(--on-accent);border-color:transparent;box-shadow:var(--e-1)}
.mult{text-align:center;margin-top:8px;font-size:var(--fs-sm);font-weight:800;color:var(--ink-2)} .mult b{color:var(--hi)}
.stage{position:relative;height:330px;margin-top:6px}
.rays{position:absolute;left:50%;top:44%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,213,74,.55) 0deg 8deg,transparent 8deg 22deg);
  -webkit-mask:radial-gradient(closest-side,#000 18%,transparent 96%);mask:radial-gradient(closest-side,#000 18%,transparent 96%)}
.opened .rays{opacity:1}
.ped{position:absolute;left:50%;bottom:34px;width:220px;height:46px;margin-left:-110px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent)}
.chest{position:absolute;left:50%;top:40px;width:240px;height:240px;margin-left:-120px}
.chest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.30))}
.chest .open{opacity:0}
.opened .chest .open{opacity:1} .opened .chest .shut{opacity:0}
.tapme{position:absolute;left:0;right:0;bottom:0;text-align:center;font:900 var(--fs-lg)/1.2 var(--font-display);color:var(--ink-1)}
.opened .tapme{opacity:0}
.reward{margin-top:4px;padding:16px;border-radius:var(--r-xl);text-align:center;background:var(--surface-1);border:2px solid var(--accent-1);box-shadow:var(--e-3);display:none}
.opened .reward{display:block}
.reward h3{font:900 24px/1.2 var(--font-display);color:var(--ink-1)}
.reward .row{display:flex;justify-content:center;gap:10px;margin-top:12px}
.reward .it{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:96px;padding:10px 12px;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line)}
.reward .it svg{width:34px;height:34px}
.reward .it b{font:800 24px/1 var(--font-latin);color:var(--ink-1)}
.reward .it span{font-size:var(--fs-sm);font-weight:700;color:var(--ink-2)}
.reward .tip{margin-top:12px;font-size:var(--fs-sm);font-weight:700;color:var(--ink-2)}
.reward .btn{margin-top:12px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="ava"><img src="assets/01.webp" alt=""><span class="lv">3</span></div>
    <div class="who"><b>小明 · 森林小队</b><div class="xp" id="xp" style="--p:.72"><i></i></div><div class="xp-t" id="xpt">180 / 250 经验</div></div>
    <div class="chips"><span class="chip" id="coins"><script>document.write(ICON.coin)</script><span id="coinN">1,280</span></span></div>
  </header>
  <div class="head"><span class="back">‹ 返回</span><h2>每日宝箱</h2></div>
  <div class="streak"><div class="days"><i class="ok">1</i><i class="ok">2</i><i class="ok">3</i><i class="ok">4</i><i class="now">5</i><i>6</i><i>7</i></div></div>
  <div class="mult">连续打卡第 5 天 · 奖励 <b>×1.8</b></div>
  <div class="stage" id="stage">
    <div class="rays" id="rays"></div>
    <div class="ped"></div>
    <div class="chest" id="chest"><img class="shut" src="assets/chest_gold.webp" alt="宝箱"><img class="open" id="openImg" src="assets/chest_open.webp" alt=""></div>
    <div class="tapme">👆 点一下，打开今天的宝箱</div>
  </div>
  <div class="reward" id="reward">
    <h3>今天的宝藏！</h3>
    <div class="row">
      <div class="it"><script>document.write(ICON.coin)</script><b>+36</b><span>金币</span></div>
      <div class="it"><script>document.write(ICON.star)</script><b>+28</b><span>经验</span></div>
    </div>
    <div class="tip">明天再来是第 6 天，奖励变成 ×2.0</div>
    <button class="btn btn-gold btn-lg btn-block">好的，去冒险 ›</button>
  </div>
</div>
<script src="fx.js"></script>
<script>
var played=false;
function openChest(){
  if(played) return; played=true;
  var app=document.getElementById('app'), chest=document.getElementById('chest');
  if(FX.reduced()){ app.classList.add('opened'); document.getElementById('coinN').textContent='1,316'; return; }
  /* 1 lift (anticipation) */
  chest.animate([{transform:'none'},{transform:'translateY(-14px) scale(1.04)'},{transform:'translateY(-6px) scale(1.02)'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});
  setTimeout(function(){
    /* 2 lid opens (cross-fade two real illustrations) + rays fade in once, then stay still */
    app.classList.add('opened');
    document.getElementById('openImg').animate([{opacity:0},{opacity:1}],{duration:180});
    document.getElementById('rays').animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'});
    chest.animate([{transform:'translateY(-6px) scale(1.02)'},{transform:'scale(1.06)'},{transform:'none'}],{duration:360,easing:'cubic-bezier(.34,1.56,.64,1)'});
    var r=chest.getBoundingClientRect(); FX.ring(r.left+r.width/2,r.top+r.height*.45,200);
    FX.burst(r.left+r.width/2,r.top+r.height*.35,{n:18,spread:120,dur:760});
    /* 3 coins arc into the top-bar counter, counter ticks during the flight only */
    setTimeout(function(){
      FX.fly(chest,document.getElementById('coins'),{n:6,dur:700,stagger:80});
      FX.count(document.getElementById('coinN'),1280,1316,1100,function(v){return v.toLocaleString('en-US');});
    },220);
    /* 4 reward card rises */
    FX.rise(document.getElementById('reward'),30,160,420);
  },240);
}
document.getElementById('stage').addEventListener('click',openChest);
if(/[?&]play=1/.test(location.search)) setTimeout(openChest,300);
if(/[?&]final=1/.test(location.search)){ document.getElementById('app').classList.add('opened'); document.getElementById('coinN').textContent='1,316'; }
</script>
</body>
</html>
