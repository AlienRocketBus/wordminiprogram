  // 🔴v844: 单形态boss隐藏形态切换UI(箭头/圆点/形象序号/设为主形象)·赛尔娅3形态保留
  if(FORMS.length<=1){var _fs=document.querySelector('.fswitch');if(_fs)_fs.style.display='none';var _sm=document.getElementById('setMainBtn');if(_sm)_sm.style.display='none';var _fn=document.getElementById('fname');if(_fn)_fn.style.display='none';}
})();
var VV=(function(){try{var m=(new URLSearchParams(location.search)).get('v');return m?('?v='+m):'?v=1156';}catch(e){return '?v=1156';}})();
function loadPref(){try{var p=JSON.parse(localStorage.getItem('hs_showcase_'+SID)||'null');return (p&&typeof p==='object')?p:{};}catch(e){return {};}}
function savePref(){try{var f=FORMS[mainFormIdx]||FORMS[0],b=BGS[curBg]||BGS[0];localStorage.setItem('hs_showcase_'+SID,JSON.stringify({formIdx:mainFormIdx,formImg:f.img,formPng:f.webp,bgIdx:curBg,bgCss:b.bg}));}catch(e){}}
var mainFormIdx=0,curForm=0;
var cardImgEl=document.querySelector('.art img'),soloEl=document.getElementById('soloChar'),fnameEl=document.getElementById('fname');
function setForm(i){
  curForm=((i%FORMS.length)+FORMS.length)%FORMS.length;
  var f=FORMS[curForm];
  if(cardImgEl){(function(fp){cardImgEl.onerror=function(){this.onerror=null;this.src=fp+VV;};})(f.webp);cardImgEl.src=f.img+VV;}
  if(soloEl)soloEl.src=f.img+VV;
  if(fnameEl)fnameEl.textContent='形 象  '+(curForm+1)+' / '+FORMS.length;
  var dots=document.querySelectorAll('.fdot');for(var k=0;k<dots.length;k++)dots[k].classList.toggle('on',k===curForm);
  var tag=document.getElementById('maintag');if(tag)tag.style.display=(curForm===mainFormIdx)?'block':'none';
  var btn=document.getElementById('setMainBtn');if(btn){var im=(curForm===mainFormIdx);btn.classList.toggle('ismain',im);btn.textContent=im?'✓ 当前主形象':'设 为 主 形 象';}
}
(function(){var w=document.getElementById('fdots');if(!w)return;FORMS.forEach(function(f,i){var d=document.createElement('div');d.className='fdot';d.addEventListener('click',function(){setForm(i);});w.appendChild(d);});})();
(function(){var p=document.getElementById('formPrev'),n=document.getElementById('formNext');if(p)p.addEventListener('click',function(){setForm(curForm-1);});if(n)n.addEventListener('click',function(){setForm(curForm+1);});})();
(function(){var hw=document.getElementById('hallwrap');if(!hw)return;var sx=0,sy=0;
  hw.addEventListener('touchstart',function(e){if(e.touches[0]){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}},{passive:true});
  hw.addEventListener('touchend',function(e){var t=e.changedTouches&&e.changedTouches[0];if(!t)return;var dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){window.__hsSwiped=true;setTimeout(function(){window.__hsSwiped=false;},350);setForm(curForm+(dx<0?1:-1));}},{passive:true});
})();
(function(){var b=document.getElementById('setMainBtn');if(!b)return;b.addEventListener('click',function(){if(curForm===mainFormIdx)return;mainFormIdx=curForm;savePref();setForm(curForm);this.textContent='✓ 已设为主形象';setTimeout(function(){setForm(curForm);},900);});})();
(function(){var p=loadPref();if(typeof p.bgIdx==='number'&&p.bgIdx>=0&&p.bgIdx<BGS.length)curBg=p.bgIdx;if(typeof p.formIdx==='number'&&p.formIdx>=0&&p.formIdx<FORMS.length)mainFormIdx=p.formIdx;setForm(mainFormIdx);applyBg(hallCard);var sws=document.querySelectorAll('.sw');for(var k=0;k<sws.length;k++)sws[k].classList.toggle('on',k===curBg);})();
</script>
<script>
(function(){
  var c=document.getElementById('galaxy'); if(!c) return;
  var x=c.getContext('2d'); if(!x) return;
  var DPR=Math.min(window.devicePixelRatio||1,2);
  var W=0,H=0,diag=0,R=0,cx=0,cy=0,incl=0.46,tilt=-0.42,spin=0,built=false;
  var gimg=null,S=0,stars=[],bright=[],shooters=[],t=0;

  function rnd(a,b){return a+Math.random()*(b-a);}
  function gauss(){return (Math.random()+Math.random()+Math.random()+Math.random()+Math.random()+Math.random()-3)/3;}

  var STOPS=[[255,240,210],[150,195,255],[90,225,240],[170,130,255],[255,150,220]];
  function armColor(tt){
    if(tt<=0)return STOPS[0].slice(); if(tt>=1)return STOPS[STOPS.length-1].slice();
    var p=tt*(STOPS.length-1), i=Math.floor(p), f=p-i, a=STOPS[i], b=STOPS[i+1];
    return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
  }

  function buildGalaxy(){
    S=Math.ceil(R*2.2);
    gimg=document.createElement('canvas'); gimg.width=S; gimg.height=S;
    var g=gimg.getContext('2d'), ox=S/2, oy=S/2;
    g.clearRect(0,0,S,S);
    g.globalCompositeOperation='lighter';
    var hg=g.createRadialGradient(ox,oy,R*0.15,ox,oy,R*1.08);
    hg.addColorStop(0,'rgba(140,165,255,0.06)'); hg.addColorStop(0.6,'rgba(130,150,255,0.025)'); hg.addColorStop(1,'rgba(130,150,255,0)');
    g.fillStyle=hg; g.beginPath(); g.arc(ox,oy,R*1.08,0,6.2832); g.fill();
    var dg=g.createRadialGradient(ox,oy,0,ox,oy,R);
    dg.addColorStop(0,'rgba(130,165,255,0.10)'); dg.addColorStop(0.55,'rgba(120,150,255,0.04)'); dg.addColorStop(1,'rgba(120,150,255,0)');
    g.fillStyle=dg; g.beginPath(); g.arc(ox,oy,R,0,6.2832); g.fill();
    var arms=2, turns=2.35, thetaMax=turns*6.2832, ds=0.0014;
    for(var a=0;a<arms;a++){
      var base=a/arms*6.2832;
      for(var s=0.05;s<=1;s+=ds){
        var theta=s*thetaMax, r=R*Math.pow(s,0.6), ang=theta+base, w=R*(0.045+0.11*s);
        if(Math.random()<0.085){
          var pr=gauss()*w*1.2;
          var gx=ox+r*Math.cos(ang)+pr*Math.cos(ang+1.5708), gy=oy+r*Math.sin(ang)+pr*Math.sin(ang+1.5708);
          var col=armColor(s), rad=rnd(w*0.55,w*1.25);
          var rg=g.createRadialGradient(gx,gy,0,gx,gy,rad);
          rg.addColorStop(0,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+',0.055)'); rg.addColorStop(1,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+',0)');
          g.fillStyle=rg; g.beginPath(); g.arc(gx,gy,rad,0,6.2832); g.fill();
        }
        if(Math.random()<0.55){
          var sr=gauss()*w*1.15;
          var sx=ox+r*Math.cos(ang)+sr*Math.cos(ang+1.5708), sy=oy+r*Math.sin(ang)+sr*Math.sin(ang+1.5708);
          var col2=armColor(s), sz=rnd(0.4,1.5)*DPR, al=rnd(0.25,0.9)*(1-0.3*s);
          g.fillStyle='rgba('+(((col2[0]+255)/2)|0)+','+(((col2[1]+255)/2)|0)+','+(((col2[2]+255)/2)|0)+','+al.toFixed(2)+')';
          g.beginPath(); g.arc(sx,sy,sz,0,6.2832); g.fill();
        }
      }
    }
    var ns=Math.floor(R*1.1);
    for(var i=0;i<ns;i++){
      var rr=Math.sqrt(Math.random())*R, aa=Math.random()*6.2832, sx2=ox+rr*Math.cos(aa), sy2=oy+rr*Math.sin(aa), fade=1-rr/R;
      g.fillStyle='rgba(255,255,255,'+(rnd(0.05,0.32)*fade).toFixed(3)+')';
      g.beginPath(); g.arc(sx2,sy2,rnd(0.3,0.95)*DPR,0,6.2832); g.fill();
    }
    var cg=g.createRadialGradient(ox,oy,0,ox,oy,R*0.34);
    cg.addColorStop(0,'rgba(255,250,236,0.92)'); cg.addColorStop(0.16,'rgba(255,242,214,0.55)'); cg.addColorStop(0.46,'rgba(255,224,176,0.16)'); cg.addColorStop(1,'rgba(255,224,176,0)');
    g.fillStyle=cg; g.beginPath(); g.arc(ox,oy,R*0.34,0,6.2832); g.fill();
    var cg2=g.createRadialGradient(ox,oy,0,ox,oy,R*0.11);
    cg2.addColorStop(0,'rgba(255,255,252,1)'); cg2.addColorStop(1,'rgba(255,252,238,0)');
    g.fillStyle=cg2; g.beginPath(); g.arc(ox,oy,R*0.11,0,6.2832); g.fill();
    g.globalCompositeOperation='source-over';
  }

  function buildStars(){
    stars=[]; bright=[]; shooters=[];
    var n=Math.floor(W*H/9000);
    for(var i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:rnd(0.3,1.1)*DPR,a:rnd(0.2,0.7),tw:rnd(0.005,0.02),ph:Math.random()*6.28});
    var nb=Math.floor(n*0.04);
    for(var j=0;j<nb;j++) bright.push({x:Math.random()*W,y:Math.random()*H,r:rnd(1.0,1.8)*DPR,a:rnd(0.5,0.95),tw:rnd(0.004,0.012),ph:Math.random()*6.28});
  }

  function build(){
    W=c.width=Math.max(1,Math.floor(window.innerWidth*DPR));
    H=c.height=Math.max(1,Math.floor(window.innerHeight*DPR));
    c.style.width=window.innerWidth+'px'; c.style.height=window.innerHeight+'px';
    if(!W||!H){built=false;return;}
    diag=Math.hypot(W,H); R=Math.max(W,H)*0.5; cx=W*0.5; cy=H*0.46;
    buildGalaxy(); buildStars(); built=true;
  }

  function frame(){
    requestAnimationFrame(frame);
    if(!built||!W||!H||!gimg||!gimg.width) return;
    t++;
    x.globalCompositeOperation='source-over'; x.clearRect(0,0,W,H);
    x.globalCompositeOperation='lighter';
    for(var i=0;i<stars.length;i++){var s=stars[i], a=s.a;/* 🔴v846 禁微光闪:canvas星星twinkle(Math.sin明灭)→固定亮度 */
      x.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')'; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.2832); x.fill();}
    x.save(); x.translate(cx,cy); x.rotate(tilt); x.scale(1,incl); x.rotate(spin); x.drawImage(gimg,-S/2,-S/2); x.restore();
    spin+=0.0006;
    for(var j=0;j<bright.length;j++){var b=bright[j], a2=b.a;/* 🔴v846 禁微光闪:canvas亮星twinkle→固定亮度 */
      var bl=x.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*4);
      bl.addColorStop(0,'rgba(255,255,255,'+(a2*0.5).toFixed(3)+')'); bl.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=bl; x.beginPath(); x.arc(b.x,b.y,b.r*4,0,6.2832); x.fill();
      x.fillStyle='rgba(255,255,255,'+a2.toFixed(3)+')'; x.beginPath(); x.arc(b.x,b.y,b.r,0,6.2832); x.fill();}
    if(Math.random()<0.004 && shooters.length<2) shooters.push({x:rnd(0,W),y:rnd(0,H*0.5),vx:rnd(4,8)*DPR,vy:rnd(2,4)*DPR,life:0,max:rnd(40,70)});
    for(var k=shooters.length-1;k>=0;k--){var sh=shooters[k]; sh.life++; sh.x+=sh.vx; sh.y+=sh.vy;
      var lp=sh.life/sh.max, al=Math.sin(lp*Math.PI);
      var tg=x.createLinearGradient(sh.x,sh.y,sh.x-sh.vx*6,sh.y-sh.vy*6);
      tg.addColorStop(0,'rgba(255,255,255,'+(0.8*al).toFixed(3)+')'); tg.addColorStop(1,'rgba(255,255,255,0)');
      x.strokeStyle=tg; x.lineWidth=1.3*DPR; x.beginPath(); x.moveTo(sh.x,sh.y); x.lineTo(sh.x-sh.vx*6,sh.y-sh.vy*6); x.stroke();
      if(sh.life>=sh.max) shooters.splice(k,1);}
    x.globalCompositeOperation='source-over';
  }

  var rt;
  window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(build,180); });
  build(); requestAnimationFrame(frame);
})();

</script>
