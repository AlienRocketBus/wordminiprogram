<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><!-- 🔴v658 防HTML缓存:部署后更新立即生效(配合腾讯云CDN刷新) --><meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词大冒险 · 武器攻击特效</title>
<style>
  :root{
    --stage-0:#0b1220; --stage-1:#0f1729; --card:#16203a; --card-edge:#243352;
    --gold:#f0b429; --gold-soft:#fbd24e; --ink:#f7fafc; --ink-dim:#9fb0c8; --ink-faint:#64789a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
    background:radial-gradient(900px 500px at 50% 12%, #1a2440 0%, transparent 55%),linear-gradient(180deg,var(--stage-1),var(--stage-0));
    background-color:var(--stage-0); color:var(--ink); min-height:100vh; padding:30px 16px 50px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:780px;margin:0 auto}
  .head{text-align:center;margin-bottom:6px}
  .head .kicker{font-size:11.5px;letter-spacing:.4em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:12px;padding-left:.4em}
  .head h1{font-size:clamp(26px,5.4vw,40px);font-weight:900;letter-spacing:.03em;background:linear-gradient(180deg,#fff,#c8d6ef);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .head .sub{margin-top:11px;color:var(--ink-dim);font-size:13.5px;line-height:1.6}
  .head .sub b{color:var(--gold-soft)}

  .arena{
    position:relative;height:clamp(330px,46vw,400px);margin:24px auto 8px;border-radius:22px;overflow:hidden;
    background:radial-gradient(460px 280px at 68% 34%, #243358 0%, #131d36 58%, #0d1426 100%);
    border:1px solid var(--card-edge);box-shadow:inset 0 2px 30px rgba(0,0,0,.5), 0 18px 40px -22px rgba(0,0,0,.8);
  }
  /* 发射位(左下) */
  .launch{position:absolute;left:15%;top:70%;width:62px;height:62px;transform:translate(-50%,-50%);z-index:5}
  .launch-base{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2c3b5e,#16223e);border:2px solid #3a4d74;box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 2px 6px rgba(255,255,255,.08)}
  .launch-core{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#7d90b3,#3a4d74);transition:box-shadow .1s,background .1s}
  .launch-tag{position:absolute;top:74px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;color:#7d90b3;font-weight:700;white-space:nowrap}
  /* Boss(右上) */
  .boss-wrap{position:absolute;left:67%;top:35%;width:150px;height:150px;transform:translate(-50%,-50%);z-index:4}
  .boss{width:150px;height:150px;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));transition:filter .1s ease}
  .boss.hit{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) brightness(1.7) saturate(.6)}
  .boss-label{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.3em;color:#7d90b3;font-weight:700}
  .fx{position:absolute;inset:0;pointer-events:none;z-index:6}
  .proj-layer{position:absolute;inset:0;pointer-events:none;z-index:7}
  .hint{text-align:center;color:var(--ink-faint);font-size:12px;margin-bottom:20px;letter-spacing:.02em}

  .weapons{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
  .wbtn{position:relative;background:linear-gradient(165deg,var(--card),#111a30);border:1px solid var(--card-edge);border-radius:14px;padding:12px 6px 10px;cursor:pointer;text-align:center;color:var(--ink);transition:transform .12s,border-color .12s,box-shadow .12s;user-select:none}
  .wbtn:hover{transform:translateY(-2px);border-color:var(--glow,#5b8dd9);box-shadow:0 10px 22px -12px rgba(0,0,0,.7)}
  .wbtn:active{transform:translateY(0)}
  .wbtn .wi{width:46px;height:46px;margin:0 auto 6px;display:block}
  .wbtn .wn{font-size:12.5px;font-weight:800;letter-spacing:.03em}
  .wbtn .wa{font-size:10.5px;color:var(--ink-faint);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .allbtn{display:block;margin:18px auto 0;background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#1a1205;border:0;border-radius:12px;padding:11px 26px;font-size:14px;font-weight:900;letter-spacing:.04em;cursor:pointer;box-shadow:0 10px 24px -10px rgba(240,180,41,.6);transition:transform .12s}
  .allbtn:hover{transform:translateY(-2px)}

  /* ── keyframes: 仅平移/扩散/淡入淡出，无旋转动画/震动/闪烁 ── */
  @keyframes fadeOut{to{opacity:0}}
  @keyframes dmgFloat{0%{opacity:0;transform:translate(-50%,0) scale(.7)}18%{opacity:1;transform:translate(-50%,-14px) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
  .dmg{position:absolute;left:50%;top:6px;font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.7);animation:dmgFloat 1s ease-out forwards;z-index:9}
  @keyframes burstOut{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}14%{opacity:1;transform:translate(-50%,-50%) scale(.92)}44%{opacity:.92;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.62)}}
  .burst{position:absolute;border-radius:50%;transform:translate(-50%,-50%);animation:burstOut .5s ease-out forwards}
  @keyframes ringOut{0%{opacity:.95;transform:translate(-50%,-50%) scale(.18)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
  .ring{position:absolute;border-radius:50%;transform:translate(-50%,-50%);animation:ringOut .55s ease-out forwards}
  @keyframes partOut{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--px),var(--py))}}
  .part{position:absolute;border-radius:50%;transform:translate(-50%,-50%);animation:partOut .72s ease-out forwards}
  @keyframes smokeUp{0%{opacity:.55;transform:translate(-50%,-50%) translateY(0) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) translateY(-54px) scale(1.5)}}
  .smoke{position:absolute;border-radius:50%;background:radial-gradient(circle,#8a93a6,transparent 70%);transform:translate(-50%,-50%);animation:smokeUp 1.1s ease-out forwards}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kicker">单词大冒险 · 武器攻击特效</div>
    <h1>七把武器，七种远程打击</h1>
    <p class="sub">从左下发射位<b>射出弹药 / 能量</b>，拖着光飞向 Boss，命中后<b>大爆发</b>。华丽度逐级递进，<b>全程无旋转 / 闪烁 / 震动</b>。</p>
  </div>

  <div class="arena" id="arena">
    <div class="launch" id="launch">
      <div class="launch-base"></div>
      <div class="launch-core" id="launchCore"></div>
      <div class="launch-tag">你的发射位</div>
    </div>
    <div class="boss-wrap" id="bossWrap">
      <div class="boss-label">BOSS</div>
      <svg class="boss" id="boss" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs><radialGradient id="bb" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#8a5cf0"/><stop offset=".6" stop-color="#6638c4"/><stop offset="1" stop-color="#3d1f80"/></radialGradient></defs>
        <path d="M30 36 l10-16 l10 14 l10-16 l10 16 l10-14 l10 16 q8 8 8 26 q0 30-28 34 q-20 3-32-6 q-16-12-16-32 q0-14 8-22 z" fill="url(#bb)" stroke="#2c1660" stroke-width="3"/>
        <ellipse cx="46" cy="62" rx="11" ry="13" fill="#fff"/><circle cx="48" cy="65" r="6" fill="#1a1030"/>
        <ellipse cx="76" cy="62" rx="11" ry="13" fill="#fff"/><circle cx="74" cy="65" r="6" fill="#1a1030"/>
        <path d="M44 90 q16 10 32 0" fill="none" stroke="#2c1660" stroke-width="4" stroke-linecap="round"/>
        <path d="M50 90 l4 -6 l4 6 l4 -6 l4 6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" opacity=".85"/>
      </svg>
      <div class="fx" id="fx"></div>
    </div>
    <div class="proj-layer" id="projLayer"></div>
  </div>
  <div class="hint">👆 点武器：弹药从发射位飞向 Boss 并爆发（可反复点 · 加特林是连续扫射）</div>

  <div class="weapons" id="weapons"></div>
  <button class="allbtn" onclick="playAll()">▶ 依次演示全部 7 把</button>
</div>

<script>
const WEAPONS=[
  {id:'fist',name:'拳头',atk:'16',glow:'#e0824a',dcol:'#ffd9a0'},
  {id:'dagger',name:'短刀',atk:'22',glow:'#a9bdd4',dcol:'#eaf2fc'},
  {id:'sword',name:'铁剑',atk:'31',glow:'#5b8dd9',dcol:'#bfe0ff'},
  {id:'axe',name:'战斧',atk:'42',glow:'#d68a4a',dcol:'#ffd29a'},
  {id:'gat',name:'加特林',atk:'55',glow:'#f59e0b',dcol:'#ffd76a'},
  {id:'cannon',name:'加农炮',atk:'71',glow:'#fb7c3c',dcol:'#ffb07a'},
  {id:'photon',name:'光子炮',atk:'90',glow:'#a855f7',dcol:'#bdf3ff'},
];
const ICONS={
  fist:'<svg viewBox="0 0 120 120"><path d="M40 48 q0-11 12-12 l22 0 q13 1 13 15 l0 16 q0 15-16 16 l-18 0 q-13-1-13-14 z" fill="#e0824a" stroke="#8d4322" stroke-width="3"/><rect x="36" y="80" width="50" height="13" rx="5" fill="#e6dcc8" stroke="#9c8e72" stroke-width="2.5"/></svg>',
  dagger:'<svg viewBox="0 0 120 120"><g transform="rotate(38 60 60)"><path d="M60 22 l8 11 l-3 40 l-5 5 l-5-5 l-3-40 z" fill="#cdd9e8" stroke="#697e98" stroke-width="2.5"/><rect x="48" y="78" width="24" height="7" rx="3" fill="#46536b"/><rect x="55" y="85" width="10" height="20" rx="4" fill="#6b4a36"/></g></svg>',
  sword:'<svg viewBox="0 0 120 120"><path d="M60 16 l7 11 l0 46 l-7 7 l-7-7 l0-46 z" fill="#bcd4ef" stroke="#5a7ba8" stroke-width="2.5"/><rect x="42" y="78" width="36" height="9" rx="4" fill="#e8bc4e" stroke="#a5780f" stroke-width="2"/><rect x="54" y="87" width="12" height="20" rx="3" fill="#5a3f2c"/></svg>',
  axe:'<svg viewBox="0 0 120 120"><rect x="55" y="24" width="10" height="80" rx="4" fill="#8a5a32" stroke="#4d3018" stroke-width="2.5"/><path d="M60 32 q24 2 28 17 q2 8-4 14 q-12-8-24-6 z" fill="#bcccdc" stroke="#65788f" stroke-width="2.5"/><path d="M60 32 q-24 2-28 17 q-2 8 4 14 q12-8 24-6 z" fill="#bcccdc" stroke="#65788f" stroke-width="2.5"/></svg>',
  gat:'<svg viewBox="0 0 120 120"><circle cx="28" cy="58" r="16" fill="#fba72a" opacity=".7"/><rect x="36" y="48" width="42" height="6" rx="3" fill="#5f6b7d"/><rect x="36" y="56" width="46" height="7" rx="3" fill="#5f6b7d"/><rect x="36" y="65" width="42" height="6" rx="3" fill="#5f6b7d"/><circle cx="84" cy="59" r="14" fill="#3a414c" stroke="#20262f" stroke-width="2.5"/></svg>',
  cannon:'<svg viewBox="0 0 120 120"><circle cx="26" cy="50" r="18" fill="#fb8b2a" opacity=".7"/><g transform="rotate(-16 60 60)"><rect x="26" y="44" width="62" height="28" rx="13" fill="#3a414c" stroke="#171c24" stroke-width="3"/><ellipse cx="28" cy="58" rx="6" ry="13" fill="#0f141b" stroke="#566076" stroke-width="2.5"/><rect x="58" y="42" width="10" height="32" rx="3" fill="#d39b2a"/></g></svg>',
  photon:'<svg viewBox="0 0 120 120"><circle cx="38" cy="58" r="22" fill="#37b6e6" opacity=".5"/><path d="M58 44 q30-5 44 6 q5 4 0 9 q-4 4-13 4 l-31 2 q-12 0-14-10 q-1-11 14-16 z" fill="#9b5cf0" stroke="#7c3aed" stroke-width="2.5"/><circle cx="38" cy="58" r="9" fill="#bdf3ff"/><circle cx="38" cy="58" r="4" fill="#fff"/></svg>',
};

const arena=document.getElementById('arena');
const launch=document.getElementById('launch');
const launchCore=document.getElementById('launchCore');
const boss=document.getElementById('boss');
const bossWrap=document.getElementById('bossWrap');
const fx=document.getElementById('fx');
const projLayer=document.getElementById('projLayer');

const wrapW=document.getElementById('weapons');
WEAPONS.forEach(w=>{
  const b=document.createElement('div'); b.className='wbtn'; b.style.setProperty('--glow',w.glow);
  b.innerHTML=`<div class="wi">${ICONS[w.id]}</div><div class="wn">${w.name}</div><div class="wa">ATK ${w.atk}</div>`;
  b.onclick=()=>attack(w); wrapW.appendChild(b);
});

// 坐标(相对arena中心点)
function pt(elm){ const r=elm.getBoundingClientRect(),a=arena.getBoundingClientRect(); return {x:r.left+r.width/2-a.left, y:r.top+r.height/2-a.top}; }
function hitBoss(d=0){ setTimeout(()=>{boss.classList.add('hit');setTimeout(()=>boss.classList.remove('hit'),120);},d); }
function flashLaunch(color,dur=200){ launchCore.style.background=`radial-gradient(circle,#fff,${color})`; launchCore.style.boxShadow=`0 0 22px ${color}, 0 0 40px ${color}`; setTimeout(()=>{launchCore.style.background='radial-gradient(circle,#7d90b3,#3a4d74)';launchCore.style.boxShadow='none';},dur); }
function dmg(val,color,d=0){ setTimeout(()=>{const e=document.createElement('div');e.className='dmg';e.textContent='-'+val;e.style.color=color;fx.appendChild(e);setTimeout(()=>e.remove(),1000);},d); }
function flashHit(size,d=0){ setTimeout(()=>{const e=document.createElement('div');e.style.cssText=`position:absolute;left:50%;top:50%;width:${size}px;height:${size}px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.55) 38%,transparent 70%);animation:fadeOut .24s ease-out forwards;z-index:7;`;fx.appendChild(e);setTimeout(()=>e.remove(),240);},d); }

// 命中爆发元素(在fx层=boss中心，可偏移)
function burst(css,dur,ox=0,oy=0){ const e=document.createElement('div');e.className='burst';e.style.cssText+=`left:calc(50% + ${ox}px);top:calc(50% + ${oy}px);`+css;fx.appendChild(e);setTimeout(()=>e.remove(),dur); }
function ring(color,size,dur,delay=0,ox=0,oy=0){ setTimeout(()=>{const e=document.createElement('div');e.className='ring';e.style.cssText+=`left:calc(50% + ${ox}px);top:calc(50% + ${oy}px);width:${size}px;height:${size}px;border:4px solid ${color};box-shadow:0 0 18px ${color};`;fx.appendChild(e);setTimeout(()=>e.remove(),dur);},delay); }
function particles(n,color,size,spread,delay=0,ox=0,oy=0){ setTimeout(()=>{for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+Math.random()*.5,dist=spread*(.5+Math.random()*.6);const e=document.createElement('div');e.className='part';e.style.cssText+=`left:calc(50% + ${ox}px);top:calc(50% + ${oy}px);width:${size}px;height:${size}px;background:${color};box-shadow:0 0 8px ${color};--px:${Math.cos(a)*dist}px;--py:${Math.sin(a)*dist}px;`;fx.appendChild(e);setTimeout(()=>e.remove(),720);}},delay); }
function smoke(){ for(let i=0;i<4;i++){const ox=(Math.random()-.5)*50;const e=document.createElement('div');e.className='smoke';e.style.cssText+=`left:calc(50% + ${ox}px);top:50%;width:${36+Math.random()*16}px;height:${36+Math.random()*16}px;`;fx.appendChild(e);setTimeout(()=>e.remove(),1100);} }

// 飞行弹药(从发射位飞向boss，带残影拖尾)
function fire(opts){
  const s=pt(launch), t=pt(bossWrap);
  const p=document.createElement('div');
  p.style.cssText=`position:absolute;left:${s.x}px;top:${s.y}px;transform:translate(-50%,-50%);transition:left ${opts.dur}ms ${opts.ease||'linear'},top ${opts.dur}ms ${opts.ease||'linear'};z-index:8;`+opts.css;
  if(opts.html)p.innerHTML=opts.html;
  projLayer.appendChild(p);
  let tt=null;
  if(opts.trail){ tt=setInterval(()=>{ const r=p.getBoundingClientRect(),a=arena.getBoundingClientRect(); const tx=r.left+r.width/2-a.left,ty=r.top+r.height/2-a.top; const d=document.createElement('div'); d.style.cssText=`position:absolute;left:${tx}px;top:${ty}px;transform:translate(-50%,-50%);animation:fadeOut .32s ease-out forwards;z-index:7;`+opts.trail; projLayer.appendChild(d); setTimeout(()=>d.remove(),320); },26); }
  requestAnimationFrame(()=>{ p.style.left=t.x+'px'; p.style.top=t.y+'px'; });
  setTimeout(()=>{ if(tt)clearInterval(tt); p.remove(); if(opts.onHit)opts.onHit(); }, opts.dur);
}

// 光束(发射位直射boss，瞬间伸展)
function beam(c1,c2,thick,dur){
  const s=pt(launch), t=pt(bossWrap);
  const dx=t.x-s.x,dy=t.y-s.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;
  const e=document.createElement('div');
  e.style.cssText=`position:absolute;left:${s.x}px;top:${s.y}px;width:${len}px;height:${thick}px;background:linear-gradient(90deg,${c2},${c1} 30%,#fff 50%,${c1} 70%,${c2});box-shadow:0 0 30px ${c1};border-radius:${thick}px;transform-origin:0 50%;transform:translateY(-50%) rotate(${ang}deg) scaleX(.08);transition:transform .1s ease-out;opacity:.96;z-index:8;`;
  projLayer.appendChild(e);
  requestAnimationFrame(()=>{ e.style.transform=`translateY(-50%) rotate(${ang}deg) scaleX(1)`; });
  setTimeout(()=>{ e.style.transition='opacity .28s'; e.style.opacity='0'; },dur-280);
  setTimeout(()=>e.remove(),dur);
}

function attack(w){
  switch(w.id){
    case 'fist':
      flashLaunch(w.glow,180);
      fire({ css:`width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff,#ffd9a0 55%,#e0824a);box-shadow:0 0 24px #ffce8a;`, trail:`width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#ffe0b0,transparent 70%);`, dur:300, ease:'cubic-bezier(.4,0,1,1)',
        onHit:()=>{ flashHit(95); burst(`width:120px;height:120px;background:radial-gradient(circle,#fff 0%,#ffe0b0 42%,#e0824a 64%,transparent 80%);`,500); ring('#ffe0b0',130,560); particles(18,'#ffd9a0',8,100); hitBoss(); dmg(w.atk,w.dcol); } });
      break;

    case 'dagger':
      for(let i=0;i<3;i++){ setTimeout(()=>{ flashLaunch(w.glow,120);
        fire({ css:`width:30px;height:8px;border-radius:6px;background:linear-gradient(90deg,transparent,#fff,#9fb3c8);box-shadow:0 0 16px #eaf2fc;`, trail:`width:14px;height:5px;border-radius:5px;background:#cdd9e8;`, dur:240,
          onHit:()=>{ const oy=(i-1)*20; burst(`width:70px;height:70px;background:radial-gradient(circle,#fff,#cdd9e8 55%,transparent 75%);`,360,0,oy); particles(8,'#eaf2fc',6,72,0,0,oy); boss.classList.add('hit');setTimeout(()=>boss.classList.remove('hit'),90); } });
      },i*130); }
      dmg(w.atk,w.dcol,360); break;

    case 'sword':
      flashLaunch(w.glow,160);
      fire({ css:`width:54px;height:54px;`, html:'<svg viewBox="0 0 60 60" style="width:54px;height:54px"><path d="M8 44 q24 -34 48 -20" fill="none" stroke="#bfe0ff" stroke-width="9" stroke-linecap="round"/><path d="M8 44 q24 -34 48 -20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg>', trail:`width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#8fc4ff,transparent 70%);`, dur:340,
        onHit:()=>{ flashHit(108); burst(`width:135px;height:135px;background:radial-gradient(circle,#fff 0%,#bfe0ff 40%,#5b8dd9 62%,transparent 80%);`,520); ring('#9fd0ff',140,580); ring('#bfe0ff',95,500,40); particles(20,'#8fc4ff',7,110); hitBoss(); dmg(w.atk,w.dcol); } });
      break;

    case 'axe':
      flashLaunch(w.glow,200);
      fire({ css:`width:58px;height:58px;`, html:'<svg viewBox="0 0 60 60" style="width:58px;height:58px"><path d="M12 30 q18-20 38-10 q4 10-4 20 q-18 8-34-2 z" fill="#ffd29a" stroke="#d68a4a" stroke-width="4" opacity=".95"/></svg>', trail:`width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,#ffb066,transparent 70%);`, dur:400,
        onHit:()=>{ flashHit(135); burst(`width:162px;height:162px;background:radial-gradient(circle,#fff 0%,#ffd29a 38%,#d68a4a 62%,transparent 80%);`,560); ring('#ffc080',170,620); ring('#ff9a4c',110,540,50); particles(24,'#ffb066',8,128); hitBoss(); setTimeout(()=>hitBoss(),110); dmg(w.atk,w.dcol); } });
      break;

    case 'gat':
      for(let i=0;i<16;i++){ setTimeout(()=>{ flashLaunch('#fba72a',90);
        fire({ css:`width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff2c2,#fba72a);box-shadow:0 0 13px #fba72a;`, trail:`width:8px;height:8px;border-radius:50%;background:#fba72a;`, dur:185,
          onHit:()=>{ const ox=(Math.random()-.5)*64,oy=(Math.random()-.5)*64; burst(`width:42px;height:42px;background:radial-gradient(circle,#fff2c2,#fba72a 50%,transparent 72%);`,280,ox,oy); boss.classList.add('hit');setTimeout(()=>boss.classList.remove('hit'),55); } });
      },i*52); }
      dmg(w.atk,w.dcol,560); break;

    case 'cannon':
      flashLaunch(w.glow,220);
      fire({ css:`width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#6a7488,#252c38);box-shadow:0 0 18px #fb8b2a, inset -4px -4px 7px #000;`, trail:`width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,#fba72a,#d43a0e 60%,transparent 75%);`, dur:500, ease:'cubic-bezier(.3,0,.9,1)',
        onHit:()=>{ flashHit(160); burst(`width:205px;height:205px;background:radial-gradient(circle,#fff6d8 0%,#fb8b2a 34%,#d43a0e 60%,transparent 80%);`,660); ring('#ffb066',195,680); ring('#ff7a3c',125,580,50); smoke(); particles(32,'#ff8a3c',9,140); particles(16,'#ffd76a',7,95); hitBoss(); setTimeout(()=>hitBoss(),130); dmg(w.atk,w.dcol); } });
      break;

    case 'photon':
      flashLaunch(w.glow,250);
      // 蓄能后射出光束
      setTimeout(()=>{ beam('#a855f7','#bdf3ff',18,360);
        setTimeout(()=>{ flashHit(150); burst(`width:148px;height:148px;background:radial-gradient(circle,#fff 0%,#9af0ff 33%,#a855f7 64%,transparent 80%);`,660); ring('#fff',95,540); ring('#c9a8ff',150,700,40); ring('#9af0ff',195,760,90); particles(30,'#c9a8ff',7,150); particles(18,'#9af0ff',6,105); particles(10,'#fff',5,72); hitBoss(); setTimeout(()=>hitBoss(),150); }, 150);
        dmg(w.atk,w.dcol,200);
      },150);
      break;
  }
}

function playAll(){ WEAPONS.forEach((w,i)=>setTimeout(()=>attack(w), i*1500)); }
</script>
