var N=BOSSES.length; /* 🔴v845: boss总数(season=5/normal=20)·替换原硬编码20·使切换/边界对两种模式都正确 */

/* ════ 状态 ════ */
var cur=0, curBg=0, lightOn=false, view=0;
function pref(){try{return JSON.parse(localStorage.getItem('bs_hall_'+BOSSES[cur].lv)||'{}')}catch(e){return {}}}
function savePref(){try{localStorage.setItem('bs_hall_'+BOSSES[cur].lv,JSON.stringify({bgIdx:curBg}))}catch(e){}}

/* ════ 全屏本命背景双层淡入切换 + 预加载 ════ */
var bgFlip=false;
function setSceneBg(lv){
  var on=document.getElementById(bgFlip?'bgB':'bgA'), off=document.getElementById(bgFlip?'bgA':'bgB');
  off.classList.remove('landblur');
  function commit(url, blur){
    off.style.backgroundImage='url("'+url+'")';
    if(blur) off.classList.add('landblur');
    off.style.opacity='1'; on.style.opacity='0'; bgFlip=!bgFlip;
  }
  function landPick(l){
    return { url: bgPath(l), blur: !window.__landDelivered(l) };
  }
  if(window.__landMode){
    var pick=landPick(lv), img=new Image();
    img.onload=function(){ commit(pick.url, pick.blur); };
    img.onerror=function(){ var alt=BOSSES[lv-1]._art+VV, a2=new Image(); a2.onload=function(){ commit(alt,true); }; a2.src=alt; };
    img.src=pick.url;
    [-1,1].forEach(function(d){ var nb=BOSSES[((cur+d)%N+N)%N]; var pk=landPick(nb.lv); var p=new Image(); p.src=pk.url; var pa=new Image(); pa.src=artPath(nb.lv); });
    return;
  }
  var url='url("'+bgPath(lv)+'")';
  var img2=new Image();
  img2.onload=function(){ off.style.backgroundImage=url; off.style.opacity='1'; on.style.opacity='0'; bgFlip=!bgFlip; };
  img2.onerror=function(){ off.style.backgroundImage='radial-gradient(900px 600px at 50% 20%,#2a2150,#0a0818)'; off.style.opacity='1'; on.style.opacity='0'; bgFlip=!bgFlip; };
  img2.src=bgPath(lv);
  [-1,1].forEach(function(d){ var nb=BOSSES[((cur+d)%N+N)%N]; var p=new Image(); p.src=bgPath(nb.lv); var pa=new Image(); pa.src=artPath(nb.lv); });
}

/* ════ 稀有度主题应用 ════ */
function applyRarity(b){
  var r=RAR[b.r], root=document.documentElement.style;
  root.setProperty('--frame',r.frame); root.setProperty('--aura',r.aura); root.setProperty('--spot',r.spot);
  root.setProperty('--ped1',r.ped1); root.setProperty('--ped2',r.ped2);
  root.setProperty('--edge1',r.edge1); root.setProperty('--edge2',r.edge2); root.setProperty('--edge3',r.edge3);
  root.setProperty('--inner',r.inner); root.setProperty('--ckglow',r.ckglow);
  root.setProperty('--namegrad',r.namegrad); root.setProperty('--platebd',r.platebd);
  root.setProperty('--rartxt',r.rartxt); root.setProperty('--diam',r.diam); root.setProperty('--moteglow',r.moteglow);
}

/* ════ 卡面背景应用(本命=场景图入窗) ════ */
function applyBg(cardEl){
  var b=BGS[curBg], w=cardEl.querySelector('.window');
  if(!w)return;
  if(b.scene){ w.style.background='url("'+bgPath(BOSSES[cur].lv)+'") center 28%/cover'; w.classList.add('scene'); }
  else{ w.style.background=b.bg; w.classList.remove('scene'); }
  var ws=cardEl.querySelector('.wstars'); if(ws)ws.style.opacity=b.scene?'.22':(b.light?'.25':'1');
}

/* ════ boss 渲染 ════ */
var card=document.getElementById('card'), artImg=document.getElementById('artImg'), solo=document.getElementById('soloChar');
function renderBoss(i,dir){
  cur=((i%N)+N)%N;
  var b=BOSSES[cur];
  applyRarity(b);
  setSceneBg(b.lv);
  artImg.src=artPath(b.lv); artImg.alt=b.n;
  solo.src=artPath(b.lv);
  document.getElementById('pname').textContent=b.n;
  var rr=RAR[b.r];
  document.getElementById('prar').innerHTML='<span class="g">◆</span><span class="g">◆</span> '+rr.t.replace(/ /g,'')+' <span class="g">◆</span><span class="g">◆</span>';
  document.getElementById('rarline').textContent='Lv.'+b.lv+' · '+rr.t;
  document.getElementById('flavor').innerHTML='<span class="qm">「</span>'+b.d+'<span class="qm">」</span>';
  document.getElementById('fname').innerHTML='<span class="lvb">Lv.'+b.lv+'</span>'+b.n;
  var p=pref(); curBg=(typeof p.bgIdx==='number'&&p.bgIdx>=0&&p.bgIdx<BGS.length)?p.bgIdx:0;
  applyBg(card);
  var sws=document.querySelectorAll('.sw'); for(var k=0;k<sws.length;k++)sws[k].classList.toggle('on',k===curBg);
  
  var wrap=document.getElementById('hallwrap');
  wrap.style.animation='none'; void wrap.offsetWidth; wrap.style.animation='';
}

/* ════ 杂项: 星点/光尘 ════ */
function sprinkle(el,n,cls){for(var i=0;i<n;i++){var s=document.createElement('div');s.className=cls;s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';s.style.animationDelay=(Math.random()*4)+'s';s.style.animationDuration=(3+Math.random()*3)+'s';if(cls==='ws')s.style.opacity=(.3+Math.random()*.6);el.appendChild(s);}}
sprinkle(document.getElementById('wstars'),22,'ws');
function makeMotes(el,n){el.innerHTML='';for(var i=0;i<n;i++){var m=document.createElement('div');m.className='mote';m.style.left=(8+Math.random()*84)+'%';m.style.animationDuration=(5+Math.random()*5)+'s';m.style.animationDelay=(Math.random()*6)+'s';var sc=.5+Math.random();m.style.width=m.style.height=(3*sc)+'px';el.appendChild(m);}}
/* 🔴v785 禁闪烁:主视图16个漂浮粒子(明灭闪)同样删除·背景静态 */
makeMotes(document.getElementById('motes'),0);

/* ════ 3D 倾斜 + 箔光 → 🔴v790 彻底静态 ════ */
function initTilt(stage,cardEl){
  // 🔴v790 根治"卡片里一片一片彩虹闪 + 一卡一卡卡顿"(Hansen 反复看到·boss图破损时尤其明显): 
  //   原来这里有个 requestAnimationFrame 死循环·空闲时让全息箔纸 .foil 用三角函数(正弦/余弦时间项)持续漂移 background-position(=彩虹斜条一片一片地闪)·并每帧给卡片应用 rotateY/rotateX 旋转(=持续重绘→一卡一卡卡顿)。二者均违反【永久禁旋转/微光闪/脉动】铁律·是 v785/v788 漏掉的真正闪烁源(之前只查了 .kb/.zbd/motes/breathe/tw)。
  //   现改为纯静态: 卡片不旋转(transform none)·箔纸/炫光固定居中(不再漂移)·无 rAF 循环·无倾斜监听·零持续重绘。主卡与放大卡(clone)都走这=都静态。
  var foil=cardEl.querySelector('.foil'),glare=cardEl.querySelector('.glare');
  if(cardEl)cardEl.style.transform='none';
  if(foil)foil.style.backgroundPosition='50% 50%';
  if(glare){glare.style.setProperty('--gx','50%');glare.style.setProperty('--gy','40%');glare.style.opacity='.3';}
  return function(){};   // 无 rAF/监听·无需 teardown
}
initTilt(document.getElementById('stage'),card);

/* ════ 背景色票 ════ */
(function(){var wrap=document.getElementById('swatches');BGS.forEach(function(b,i){
  var d=document.createElement('div');d.className='sw'+(i===0?' on scene':'');
  if(b.scene){d.title='本命背景';}
  else d.style.background=b.sw;
  d.addEventListener('click',function(){curBg=i;applyBg(card);var z=document.querySelector('#zcardwrap .card');if(z)applyBg(z);document.querySelectorAll('.sw').forEach(function(x){x.classList.remove('on')});d.classList.add('on');savePref();});
  wrap.appendChild(d);
});})();
function refreshSceneSwatch(){var s=document.querySelector('.sw.scene');if(s)s.style.backgroundImage='url("'+bgPath(BOSSES[cur].lv)+'")';}

/* ════ 光效 ════ */
var lightBtn=document.getElementById('lightBtn');
function setLight(on){lightOn=on;card.classList.toggle('lit',on);var z=document.querySelector('#zcardwrap .card');if(z)z.classList.toggle('lit',on);lightBtn.classList.toggle('on',on);lightBtn.textContent=on?'开启':'关闭';}
lightBtn.addEventListener('click',function(){setLight(!lightOn);});

/* ════ 放大 ════ */
var zoom=document.getElementById('zoom'),zwrap=document.getElementById('zcardwrap'),zteardown=null;
function openZoom(){
  if(window.__bsSwiped) return;
  var clone=card.cloneNode(true);clone.style.transform='';
  clone.removeAttribute('id');var _cid=clone.querySelectorAll('[id]');for(var _i=0;_i<_cid.length;_i++)_cid[_i].removeAttribute('id');
  zwrap.innerHTML='';zwrap.appendChild(clone);applyBg(clone);clone.classList.toggle('lit',lightOn);
  /* 🔴v785 禁闪烁:删放大层24个漂浮粒子(明灭闪)+开卡爆闪burst·背景保持静态不再"有东西在闪" */
  zoom.classList.add('show');zteardown=initTilt(zoom,clone);
}
function closeZoom(){zoom.classList.remove('show');if(zteardown){zteardown();zteardown=null;}zwrap.innerHTML='';}
document.getElementById('hallwrap').addEventListener('click',openZoom);
document.getElementById('zbd').addEventListener('click',closeZoom);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeZoom();});

/* ════ 眼睛三段: 0完整 / 1仅角色+本命背景 / 2仅本命背景(壁纸) ════ */
(function(){
  var header=document.querySelector('header'), stage=document.getElementById('stage'),
      below=document.querySelector('.below'), note=document.querySelector('.note'),
      ground=document.getElementById('soloGround'), hint=document.getElementById('wallHint'),
      vign=document.getElementById('vign');
  var hintTimer=null;
  function applyView(v){
    var full=(v===0);
    if(header)header.style.display=full?'':'none';
    if(stage)stage.style.display=full?'':'none';
    if(below)below.style.display=full?'':'none';
    if(note)note.style.display=full?'':'none';
    vign.classList.toggle('off',!full);
    if(v===1){solo.classList.add('show');ground.classList.add('show');}
    else{solo.classList.remove('show');ground.classList.remove('show');}
    if(hintTimer){clearTimeout(hintTimer);hintTimer=null;}
    if(v===2){hint.classList.add('show');hintTimer=setTimeout(function(){hint.classList.remove('show');},2600);}
    else hint.classList.remove('show');
  }
  var btn=document.getElementById('viewBtn');
  if(btn) btn.addEventListener('click',function(){ view=(view+1)%3; applyView(view); });
})();

/* ════ boss 切换: 箭头 + 全局左右滑(三种视图都可滑) ════ */
function stepOwned(dir){var i=cur;for(var k=0;k<N;k++){i=((i+dir)%N+N)%N;if(isOwned(BOSSES[i].lv)){renderBoss(i);refreshSceneSwatch();return;}}}
document.getElementById('bossPrev').addEventListener('click',function(){stepOwned(-1);});
document.getElementById('bossNext').addEventListener('click',function(){stepOwned(1);});
(function(){if(OWN&&OWN.length<=1){var f=document.querySelector('.fswitch');if(f)f.style.display='none';}})();
(function(){var sx=0,sy=0;
  document.body.addEventListener('touchstart',function(e){if(e.touches[0]){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}},{passive:true});
  document.body.addEventListener('touchend',function(e){var t=e.changedTouches&&e.changedTouches[0];if(!t)return;var dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){window.__bsSwiped=true;setTimeout(function(){window.__bsSwiped=false;},350);stepOwned(dx<0?1:-1);}},{passive:true});
})();
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){stepOwned(-1);}if(e.key==='ArrowRight'){stepOwned(1);}});

/* ════ 启动 ════ */
var startLv=(function(){var m=parseInt(QS.get('lv')||'1',10);if(!(m>=1&&m<=N))m=1;if(!isOwned(m)&&OWN&&OWN.length)m=OWN[0];if(window.__landStartLv)m=window.__landStartLv;return m;})();
renderBoss(startLv-1); refreshSceneSwatch();
/* 🔴v792 启动后延迟预加载【全部20个】boss角色立绘(每张仅19-46KB·共~600KB·弱网下提前下好缓存·根治"点开boss卡只剩背景没角色立绘"——立绘下好后切到任意boss都能立即显示)。延迟1.2s避免和当前卡的立绘/场景抢带宽。 */
setTimeout(function(){ try{ for(var _pi=0;_pi<BOSSES.length;_pi++){ var _im=new Image(); _im.src=artPath(BOSSES[_pi].lv); } }catch(_e){} }, 1200);
</script>
