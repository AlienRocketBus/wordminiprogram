  function show(which){
    ['pkHome','pkRoomScreen','pkLadderScreen'].forEach(function(id){
      var el=$(id); if(el) el.classList.toggle('on', id===which);
    });
    try{ window.scrollTo(0,0); }catch(e){}
  }

  /* ── 身份条 ── */
  /* 🔴v1142：**换账号后界面要立刻跟上。**
     资料模块换账号时会派发 hsn-profile-reset，这里收到就重画身份条 ——
     否则用户看到的还是上一个账号的名字和竞赛 ID，
     得杀掉重开才对，而他多半会以为"这 App 坏了"。
     挂在 renderMe 定义处而不是脚本末尾：末尾可能在某个 return 之后
     根本执行不到（实测踩过）。 */
  try {
    document.addEventListener('hsn-profile-reset', function(){
      setTimeout(function(){ try{ renderMe(); }catch(e){} }, 60);
    });
    document.addEventListener('hsn-auth-changed', function(){
      setTimeout(function(){ try{ renderMe(); }catch(e){} }, 60);
    });
  } catch(e) {}

  function renderMe(){
    var el=$('pkMe'); if(!el) return;
    var P=window.HansenSbProfile;
    var p=P?P.readProfile():{name:'',cid:0,cidLocked:false};
    var L=readLadder();
    /* 🔴v1156：**用户卡片和天梯页读的不是同一份数据。**

       截图看到卡片写「🐝 工蜂 · 未定级」—— 自相矛盾（有段位却说未定级），
       而同一屏下面的天梯入口写着「工蜂 · 1078 分 · 🔥 3 连胜」。

       原因：卡片读的是 readLadder()（v1002 的旧存档），
       而天梯战绩在 HansenPkRecord（v1103 起的新存档）。
       两个数据源各说各话，用户不知道该信哪个。

       > 同一件事在两个地方显示，就一定要问：它们读的是同一份数据吗？ */
    try {
      var _R = window.HansenPkRecord;
      if (_R && _R.summary) {
        var _sm = _R.summary();
        if (_sm && _sm.total) { L = { rating: _sm.rating, placed: !!_sm.placed }; }
      }
    } catch (e) {}
    var tier=(window.HansenSbLadder)?HansenSbLadder.tierOf(L.rating||1000):null;
    /* 🔴v1129：**没有竞赛 ID 时不要显示「No.---」。**
       破折号什么也没说 —— 用户不知道是"还没加载好"还是"我没有"。
       而好友页还写着"竞赛 ID 在拼写大PK页面顶部"，
       他跑过来一看是 No.---，**两头都卡住**。
       没登录就直说"登录后自动分配"，让他知道下一步该做什么。 */
    var hasCid=!!(P&&p.cid);
    var cidHtml=hasCid?('No.'+P.fmtCid(p.cid))
      :'<span style="font-weight:400;font-size:12.5px;opacity:.85">登录后自动分配</span>';
    el.innerHTML='<span class="pk_ava">'+(p.avatar||'🐝')+'</span><div style="min-width:0;flex:1">'
      +(p.name?'<div class="pk_nm">'+escapeHtml(p.name)+'</div>':'<div class="pk_nm" style="opacity:.7">点这里设置名字</div>')
      +'<div class="pk_cid">🎫 竞赛 ID <b>'+cidHtml+'</b>'
+'</div>'
      +(tier?'<div class="pk_tier">'+tier.icon+' '+tier.name+(L.placed?' · '+L.rating+' 分':' · 未定级')+'</div>':'')
      +'</div><span class="pk_go">›</span>';
    el.onclick=function(){
      try{
        /*🔴v1004: 没登录先引导登录(登录才有跨设备存档与正式竞赛ID); 已登录则进资料页*/
        if(window.HansenAuth && HansenAuth.ready() && !HansenAuth.isSignedIn() && window.HansenAuthUI){
          HansenAuthUI.open(); return;
        }
        if(window.HansenSbProfile) HansenSbProfile._open();
      }catch(e){}
    };
  }
  /*🔴v1016 账号区：未登录给注册入口；已登录给切换/退出*/
  function renderAcct(){
    var box=$('pkAcct'); if(!box) return;
    var A=window.HansenAuth;
    if(!A || !A.ready()){
      box.innerHTML='<div class="pk_acct_tip">☁️ 云端账号还没开通，进度暂存在本机。</div>';
      return;
    }
    if(A.isSignedIn()){
      var lc=A.readLocal();
      /* 🔴v1156：**兜底成「已登录」会拼出「✅ 已登录 已登录」。**
         截图看到的就是这个 —— 同一个词说了两遍，像是程序出错了。
         拿不到手机号/用户名时干脆不带 ——「✅ 已登录」本身已经说清楚了。 */
      var who=lc.phone||lc.username||'';
      box.innerHTML='<div class="pk_acct_tip">✅ 已登录'+(who?' '+escapeHtml(who):'')+'　进度已跟随账号，换设备登录即可找回。</div>'
        +'<div class="pk_acct"><button class="pk_ab" id="pkSwitch">🔄 切换账号</button>'
        +'<button class="pk_ab" id="pkOut">🚪 退出登录</button></div>';
      var sw=$('pkSwitch'), out=$('pkOut');
      if(sw) sw.onclick=function(){
        if(!confirm('切换账号会先退出当前账号，确定吗？')) return;
        A.signOut().then(function(){ renderMe(); renderAcct();
          try{ if(window.HansenAuthUI) HansenAuthUI.open(); }catch(e){} });
      };
      if(out) out.onclick=function(){
        if(!confirm('退出后本机进度仍在，但不再同步到云端。确定退出？')) return;
        A.signOut().then(function(){ renderMe(); renderAcct(); });
      };
    } else {
      box.innerHTML='<div class="pk_acct"><button class="pk_ab primary" id="pkReg">🔐 注册 / 登录</button></div>'
        +'<div class="pk_acct_tip">登录后进度存到云端，换手机登录同一账号，等级、卡册、成就全都在。</div>';
      var reg=$('pkReg');
      if(reg) reg.onclick=function(){ try{ if(window.HansenAuthUI) HansenAuthUI.open(); }catch(e){} };
    }
  }

  function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}

  /* 战绩速览：把用户真正想看的三个数放首屏 */
  function renderGlance(){
    var box=$('pkGlance'); if(!box) return;
    var P=window.HansenSbProfile;
    var s=P?P.collectStats():{bestCpm:0,learned:0,days:0};
    var L=readLadder();
    /* 🔴v1156：**速览的「对战胜率」读的是旧存档，永远显示「—」。**

       实测：打了 5 局天梯（5 胜 0 负），
       速览里「对战胜率」还是「—」。

       根因和用户卡片那处一模一样：
       速览读 readLadder()（v1002 的旧存档），
       而天梯战绩在 HansenPkRecord（v1103 起的新存档）。

       > **同一个数据换了存放位置，所有读它的地方都要跟着改。**
       > 改漏一处，用户就会看到一个永远不动的数字 ——
       > 而永远不动的数字比没有更糟：他会以为自己白打了。

       （几轮前修用户卡片时改了一处，这处又漏了 ——
         同一个问题在同一个文件里出现两次。） */
    try {
      var _R2 = window.HansenPkRecord;
      if (_R2 && _R2.summary) {
        var _s2 = _R2.summary();
        if (_s2 && _s2.total) {
          L = { games: _s2.total, wins: _s2.wins,
                rating: _s2.rating, placed: !!_s2.placed };
        }
      }
    } catch (e) {}
    var rate=L.games?Math.round(L.wins/L.games*100):0;
    box.innerHTML='<div class="pk_grid">'
      +'<div class="pk_it"><div class="pk_v">'+(s.bestCpm||0)+'</div><div class="pk_l">最快速度(字符/分)</div></div>'
      +'<div class="pk_it"><div class="pk_v">'+(L.games?rate+'%':'—')+'</div><div class="pk_l">对战胜率</div></div>'
      +'<div class="pk_it"><div class="pk_v">'+(s.learned||0)+'</div><div class="pk_l">已掌握单词</div></div>'
      +'<div class="pk_it"><div class="pk_v">'+(s.days||0)+'</div><div class="pk_l">连续学习(天)</div></div>'
      +'</div>';
  }

  function readLadder(){
    var d={rating:0,placed:false,games:0,wins:0,losses:0,streak:0,bestStreak:0};
    try{ var o=JSON.parse(localStorage.getItem('hansen_sb_ladder_v1002'));
      if(o&&typeof o==='object'&&!Array.isArray(o)){
        ['rating','games','wins','losses','streak','bestStreak'].forEach(function(k){
          var v=+o[k]; if(isFinite(v)&&v>=0) d[k]=Math.floor(v); });
        d.placed=!!o.placed;
      }}catch(e){}
    return d;
  }

  /* 进任何对战模式前, 必须先有名字与号码 */
  /* 🔴v1163（真机报的）：**登录了却「连个建房按钮都没有」。**

     用户原话：「登录了，点击建房后，根本没有下一个可以开启房间的按钮」。

     复现出来了：**登录了但档案里没名字**时——
       ① alert 一句「先给自己起个名字吧」
       ② 调 `P._open()` 想打开起名界面
       ③ **而 _open() 实测根本打不开任何东西**（调用没抛错，界面没出现）
       ④ return false，房间界面不打开

     用户看到的就是：点建房 → 弹个提示 → 划掉 → 什么都没有。
     而手机上 alert 经常被顺手划掉，甚至被浏览器折叠，
     于是就成了**「点了完全没反应」**。

     > 一个把人挡在门外的检查，必须同时给出**进门的路**。
     > 只说"你还不能进"而不说怎么办，等于门是坏的。

     两处改动：
       · 不再依赖 `P._open()`（它坏了，而且坏了没人知道）——
         自己画一个页面内的起名屏，用同一套 pk_screen 样式
       · 起完名字自动回到刚才想去的地方（房间/天梯），
         而不是让人再点一次

     ⚠️ 保留 alert 作为兜底：万一这个屏也画不出来，
     至少还有一句话，比彻底静默强。 */
  function askName(after){
    var P=window.HansenSbProfile;
    var host=document.getElementById('pkNameAsk');
    if(!host){
      host=document.createElement('div');
      host.id='pkNameAsk';
      host.className='pk_screen';
      document.body.appendChild(host);
    }
    host.innerHTML=
      '<div class="pk_hd">'
      + '<button class="pk_back" id="pkNameBack">← 返回</button>'
      + '<div><div class="pk_h1">✏️ 先起个名字</div>'
      + '<div class="pk_sub">对手会看到这个名字</div></div></div>'
      + '<div style="padding:18px 16px">'
      + '<input id="pkNameIn" type="text" maxlength="12" placeholder="比如：小明"'
      + ' style="width:100%;box-sizing:border-box;padding:14px 12px;font-size:17px;'
      + 'border-radius:12px;border:1px solid rgba(255,255,255,.22);'
      + 'background:rgba(255,255,255,.06);color:#fff">'
      + '<div style="font-size:12.5px;color:var(--hpk-dim,#9aa);margin-top:10px;line-height:1.7">'
      + '起好名字就会拿到一个竞赛 ID，之后终身不变。</div>'
      + '<button id="pkNameOk" class="pk_card" style="width:100%;margin-top:16px;'
      + 'text-align:center;padding:14px">开始吧</button>'
      + '<div id="pkNameErr" style="font-size:13px;color:#fca5a5;margin-top:10px"></div>'
      + '</div>';
    document.querySelectorAll('.pk_screen').forEach(function(e){
      e.style.display = (e===host) ? 'block' : 'none';
    });
    host.style.display='block';
    var back=document.getElementById('pkNameBack');
    if(back) back.onclick=function(){ location.reload(); };
    var inp=document.getElementById('pkNameIn');
    if(inp) setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 120);
    var ok=document.getElementById('pkNameOk');
    if(ok) ok.onclick=function(){
      var v=(inp&&inp.value||'').trim();
      var err=document.getElementById('pkNameErr');
      if(!v){ if(err) err.textContent='名字不能是空的'; return; }
      try{
        P.saveProfile ? P.saveProfile({name:v}) : P.setName && P.setName(v);
        P.ensureCid && P.ensureCid();
      }catch(e){ if(err) err.textContent='存不下来，刷新一下再试'; return; }
      host.style.display='none';
      /* v1164：起名屏打开时把别的屏都设成了 display:none（写在元素上）——起完名要还原，
         否则从这里进天梯、再关掉天梯，底下的大PK首页是空白的（首页按钮全都点不到） */
      document.querySelectorAll('.pk_screen').forEach(function(e){ if(e!==host) e.style.display=''; });
      if(typeof after==='function') { try{ after(); }catch(e){} }
    };
  }

  function requireIdentity(after){
    var P=window.HansenSbProfile;
    if(!P){
      alert('账号模块还没加载好，刷新一下页面再试。');
      return false;
    }
    var p={};
    try{ p=P.readProfile()||{}; }catch(e){ p={}; }
    if(!p.name){
      askName(after);          /* 画一个真的能用的起名屏 */
      return false;
    }
    try{ P.ensureCid(); }catch(e){}
    return true;
  }

  /* ── 公开房间 ── */
  function renderRooms(){
    var box=$('pkRoomList'); if(!box) return;
    if(!cloudReady()){
      box.innerHTML='<div class="pk_empty">☁️ 联网对战还没开通<br><br>'
        +'开通云服务后，这里会显示所有等待中的房间，<br>点一下就能加入别人的对局。</div>';
      var cb=$('pkCreate'); if(cb) cb.disabled=true, cb.style.opacity='.5';
      return;
    }
    box.innerHTML='<div class="pk_empty">暂时还没有人开房，<br>你可以自己开一间等人来。</div>';
  }

  /* ── 天梯 ── */
  function renderLadder(){
    var box=$('pkLadderBody'); if(!box) return;
    var L=readLadder();
    /* 🔴v1156：**第三处读旧存档的地方。**

       前两处（用户卡片、战绩速览）已经改了，这处又漏了 ——
       同一个文件里同一个问题出现了三次。

       > 一个数据换了家，读它的地方往往不止一两处。
       > **靠"我记得还有哪几处"是不行的，得全站搜一遍。** */
    try {
      var _R3 = window.HansenPkRecord;
      if (_R3 && _R3.summary) {
        var _s3 = _R3.summary();
        if (_s3 && _s3.total) {
          L = { rating: _s3.rating, placed: !!_s3.placed,
                games: _s3.total, wins: _s3.wins, losses: _s3.losses,
                streak: _s3.streak };
        }
      }
    } catch (e) {}
    var L2=window.HansenSbLadder;
    var tier=L2?L2.tierOf(L.rating||1000):null;
    var P=window.HansenSbProfile;
    var est=(P&&L2)?L2.placementEstimate((P.collectStats()||{}).bestCpm||0):1000;

    var h='';
    if(tier){
      h+='<div class="pk_row" style="display:block;text-align:center;padding:18px 14px">'
        +'<div style="font-size:44px;line-height:1">'+tier.icon+'</div>'
        +'<div style="font-size:20px;font-weight:900;margin-top:6px">'+tier.name+'</div>'
        +'<div style="font-size:13px;opacity:.78;margin-top:4px;font-weight:700">'
        +(L.placed?(L.rating+' 分'):'尚未定级')+'</div></div>';
    }
    h+='<div class="pk_grid">'
      +'<div class="pk_it"><div class="pk_v">'+L.games+'</div><div class="pk_l">总场次</div></div>'
      +'<div class="pk_it"><div class="pk_v">'+(L.games?Math.round(L.wins/L.games*100):0)+'%</div><div class="pk_l">胜率</div></div>'
      +'<div class="pk_it"><div class="pk_v">'+L.wins+' 胜</div><div class="pk_l">'+L.losses+' 负</div></div>'
      +'<div class="pk_it"><div class="pk_v">'+L.bestStreak+'</div><div class="pk_l">最长连胜</div></div>'
      +'</div>';

    if(!cloudReady()){
      h+='<div class="pk_note">🚧 天梯马上就来。<br>'
        +'按你现在的拼写速度，预计能从 <b>'+(L2?L2.tierOf(est).name:'')+'</b> 起步。</div>';
    } else {
      h+='<button class="pk_btn" id="pkMatch">开始匹配</button>';
    }
    box.innerHTML=h;
    var mb=$('pkMatch');
    if(mb) mb.onclick=function(){ if(requireIdentity()) alert('正在寻找对手…'); };
  }

  /* ── 绑定 ── */
  function boot(){
    renderMe(); renderGlance(); renderAcct();
    var r=$('pkRooms'), l=$('pkLadder');
    /* v1065: 原来打开的是写死的占位屏，现改为真实房间匹配（与页面内屏共用同一实现）。 */
    if(r) r.onclick=function(){
      /* v1163: 把「起完名字要去哪」作为回调传进去 ——
         用户点的是"进房间"，起完名字就该到房间，
         而不是回到首页让他再点一次。 */
      var go=function(){
        if(window.HansenPkRoomUI){ HansenPkRoomUI.open(); return; }
        renderRooms(); show('pkRoomScreen');   /* 模块没加载时退回原占位屏 */
      };
      if(!requireIdentity(go))return;
      go();
    };
    /* v1163: 天梯的点击绑定统一放到下面 _lb 那一处 ——
       原来这里也绑了一次，被后面覆盖，改这里等于白改。 */
    var backs=document.querySelectorAll('[data-home]');
    for(var i=0;i<backs.length;i++) backs[i].onclick=function(){ renderMe(); renderGlance(); show('pkHome'); };
    /* 资料页关闭后刷新身份条(改名/发号会变) */
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) renderMe(); });
  /* 🔴v1108 天梯入口：v1103 做了分数/段位/定级赛，v1108 补实力匹配与战绩页。
     在这之前它一直是「敬请期待」—— 做了功能没入口等于没做。 */
  /* 🔴v1163（用户真机报的）：**点「天梯排位」完全没反应。**

     用户截图上写着「点这里设置名字」—— 他还没起名字。

     根因是**同一个按钮被绑了两次**：
       前面那处：带 requireIdentity 检查（v1163 我刚修好的）
       这里：直接调 HansenLadderUI.open()，**不检查身份**

     后绑的覆盖先绑的，所以我上一版的修复**根本没生效** ——
     而天梯 UI 内部拿不到名字就什么都不做，于是彻底静默。

     > **一个元素被绑两次事件，先绑的那次等于不存在。**
     > 而两处代码隔了十几行、中间夹着别的逻辑，
     > 看代码时很容易以为它们各管各的。
     >
     > 这也是我上一版「修好了房间没修好天梯」的真正原因 ——
     > 我改的是那个已经失效的绑定。

     合并成一处：先过身份检查，起完名字自动进天梯。 */
  var _lb = document.getElementById('pkLadder');
  if (_lb) _lb.onclick = function () {
    var go = function () {
      if (window.HansenLadderUI) { HansenLadderUI.open(); return; }
      renderLadder(); show('pkLadderScreen');
    };
    if (!requireIdentity(go)) return;
    go();
  };

  /* v1107 好友入口 */
  var _fb = document.getElementById('pkFriends');
  /* v1163: 好友入口同样要过身份检查 ——
     实测没名字时点它也是彻底静默（好友 UI 拿不到身份就不动）。
     > 三个入口共用一套身份前提，就该共用一套检查 ——
     > 漏掉任何一个，用户看到的都是「这个按钮是坏的」。 */
  if (_fb) _fb.onclick = function () {
    var go = function () {
      if (window.HansenFriendsUI) { HansenFriendsUI.open(); return; }
      alert('好友功能正在加载，稍等一下再点');
    };
    if (!requireIdentity(go)) return;
    go();
  };
    document.addEventListener('hsn-auth-changed', function(){ renderMe(); renderAcct(); });
    setInterval(function(){ renderMe(); renderGlance(); renderAcct(); }, 1500);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
