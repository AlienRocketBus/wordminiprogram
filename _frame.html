<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>单词大冒险</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;color:#fff;font-family:"Microsoft YaHei","微软雅黑",sans-serif;background:radial-gradient(circle at 50% 28%,#20204a,#0a0a16 72%)}
#wrap{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
h1{font-size:30px;letter-spacing:2px;margin-bottom:6px;background:linear-gradient(90deg,#8ab4ff,#c99bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.sub{color:#9aa0c8;font-size:15px;margin-bottom:28px;text-align:center}
.row{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.card{width:196px;padding:28px 20px;border-radius:18px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);cursor:pointer;text-align:center;transition:.16s;-webkit-user-select:none;user-select:none}
.card:hover{transform:translateY(-5px);background:rgba(255,255,255,.12);border-color:#8ab4ff;box-shadow:0 16px 42px rgba(80,110,255,.32)}
.card .ic{font-size:48px;margin-bottom:12px}
.card .t{font-size:20px;font-weight:700;margin-bottom:7px}
.card .d{font-size:12.5px;color:#9aa0c8;line-height:1.55}
.card .rec{display:inline-block;margin-top:8px;font-size:11px;color:#8ab4ff;border:1px solid #8ab4ff;border-radius:10px;padding:1px 8px}
#phone{width:414px;height:88vh;max-height:896px;border:0;border-radius:26px;box-shadow:0 18px 70px rgba(0,0,0,.6),0 0 0 8px #14142a;background:#000;display:block}
#sw{padding:8px 18px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#cfd2ff;border-radius:20px;font-size:13px;cursor:pointer;transition:.15s}
#sw:hover{background:rgba(255,255,255,.18)}
</style>
</head>
<body>
<div id="wrap"></div>
<script>
(function(){
  var KEY='hsnViewMode';
  function q(n){ try{ var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search); return m?decodeURIComponent(m[1]):''; }catch(e){ return ''; } }
  function esc(s){ return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function setMode(m){ try{ localStorage.setItem(KEY,m); }catch(e){} }
  function getMode(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  var u = q('u') || 'index.html';
  var mode = getMode();
  var wrap = document.getElementById('wrap');

  if(mode==='desktop'){                       // 电脑版不该停在这里, 兜底跳回游戏
    try{ location.replace(u); }catch(e){ location.href=u; }
    return;
  }
  if(mode==='mobile'){                         // 手机版: 只放一个手机尺寸 iframe(游戏在里面跑一份, 别无他物=绝不重叠)
    wrap.innerHTML = '<iframe id="phone" src="'+esc(u)+'" allow="autoplay; fullscreen"></iframe>'
      + '<button id="sw">💻 切换到电脑版</button>';
    var sw=document.getElementById('sw');
    if(sw) sw.onclick=function(){ setMode('desktop'); try{location.replace(u);}catch(e){ location.href=u; } };
    return;
  }
  // 没选过 → 选择器
  wrap.innerHTML = '<h1>单词大冒险</h1><div class="sub">检测到你在电脑上打开，请选择显示方式</div>'
    + '<div class="row">'
    + '<div class="card" id="cm"><div class="ic">📱</div><div class="t">手机版</div><div class="d">和手机上完全一样的样子</div><div class="rec">推荐</div></div>'
    + '<div class="card" id="cd"><div class="ic">💻</div><div class="t">电脑版</div><div class="d">铺满整个浏览器窗口</div></div>'
    + '</div>';
  var cm=document.getElementById('cm'), cd=document.getElementById('cd');
  if(cm) cm.onclick=function(){ setMode('mobile'); try{location.reload();}catch(e){ location.href=location.href; } };
  if(cd) cd.onclick=function(){ setMode('desktop'); try{location.replace(u);}catch(e){ location.href=u; } };
})();
</script>
</body>
</html>
